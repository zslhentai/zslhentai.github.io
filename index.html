<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07101d">
<title>霓虹闪避</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}body{position:fixed;inset:0}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;inset:0;pointer-events:none;color:#fff}#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}#scorePill{justify-self:start}#bestPill{justify-self:end}#pauseBtn{position:fixed;z-index:50;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:50%;font-size:17px;font-weight:900;display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-tap-highlight-color:transparent;touch-action:manipulation}#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:86%;max-width:380px;padding:26px 20px;border-radius:28px;background:rgba(8,16,31,.58);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.35)}#title{font-size:34px;font-weight:900;letter-spacing:2px}#text{margin-top:12px;opacity:.8;line-height:1.65;font-size:15px}#hint{margin-top:18px;font-size:18px;font-weight:800;animation:pulse 1.15s infinite}#tip{margin-top:10px;font-size:12px;opacity:.5}@keyframes pulse{50%{opacity:.32;transform:scale(.98)}}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui"><div id="top"><div class="pill" id="scorePill">分数 <span id="score">0</span></div><div></div><div class="pill" id="bestPill">最高 <span id="best">0</span></div></div><div id="center"><div id="title">霓虹闪避</div><div id="text">左右滑动控制蓝色小球，躲避粉色障碍。<br>手指放哪里都可以，不需要按住角色。</div><div id="hint">触摸屏幕开始</div><div id="tip">竖屏 · 单手操作</div></div></div>
<button id="pauseBtn" aria-label="暂停">Ⅱ</button>
<script>
(function(){'use strict';
var canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),center=document.getElementById('center'),pauseBtn=document.getElementById('pauseBtn');
var W=0,H=0,DPR=1,started=false,dead=false,paused=false,last=0,time=0,spawn=0,score=0,best=0;try{best=parseInt(localStorage.getItem('neonBest')||'0',10)||0;}catch(e){}bestEl.textContent=best;
var player={x:0,y:0,r:14,targetX:0,maxSpeed:760},blocks=[],stars=[],lastSpawnX=null;
var dragging=false,lastTouchX=0,controlGain=1.15;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);player.y=H*.82;if(!player.x){player.x=W/2;player.targetX=W/2;}makeStars();}
addEventListener('resize',resize);function makeStars(){stars=[];var n=Math.max(35,Math.floor(W*H/12000));for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,a:Math.random()*.55+.15});}
function reset(){started=true;dead=false;paused=false;dragging=false;last=performance.now();time=0;spawn=.35;score=0;blocks.length=0;lastSpawnX=null;player.x=W/2;player.targetX=W/2;player.y=H*.82;scoreEl.textContent='0';center.style.display='none';pauseBtn.style.display='flex';pauseBtn.textContent='Ⅱ';}
function setPaused(v){if(!started||dead)return;paused=v;dragging=false;pauseBtn.textContent=paused?'▶':'Ⅱ';if(paused){center.style.display='block';center.innerHTML='<div id="title">已暂停</div><div id="text">分数 '+score+'<br>进度已保留。</div><div id="hint">点屏幕继续</div><div id="tip">也可以点顶部 ▶</div>';}else{center.style.display='none';last=performance.now();}}
function endGame(){if(dead)return;dead=true;started=false;paused=false;dragging=false;pauseBtn.style.display='none';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neonBest',String(best));}catch(e){}}center.style.display='block';center.innerHTML='<div id="title">撞到了</div><div id="text">本局 <b>'+score+'</b> 分<br>最高 <b>'+best+'</b> 分</div><div id="hint">点一下重新开始</div><div id="tip">左右滑动比之前更直接</div>';if(navigator.vibrate)try{navigator.vibrate(70);}catch(e){}}
function spawnSingle(){var d=Math.min(time/45000,1),w=42+Math.random()*(55+d*22),h=18+Math.random()*26,roll=Math.random(),x;if(roll<.36)x=player.x-w/2+(Math.random()-.5)*70;else if(roll<.66){var left=Math.random()<.5,zone=Math.max(28,W*.22);x=left?Math.random()*zone:(W-w-Math.random()*zone);}else x=Math.random()*(W-w);x=Math.max(0,Math.min(W-w,x));if(lastSpawnX!==null&&Math.abs(x-lastSpawnX)<22&&Math.random()<.7)x=(x+W*.42)%(Math.max(1,W-w));lastSpawnX=x;blocks.push({x:x,y:-h-10,w:w,h:h,v:220+d*245+Math.random()*80});}
function spawnGate(){var d=Math.min(time/45000,1),gapW=Math.max(92-player.r*2,Math.min(132,W*.28)),m=8,gc=m+gapW/2+Math.random()*Math.max(1,W-2*m-gapW),lw=gc-gapW/2,rx=gc+gapW/2,rw=W-rx,h=20+Math.random()*16,v=215+d*235;if(lw>18)blocks.push({x:0,y:-h-10,w:lw,h:h,v:v});if(rw>18)blocks.push({x:rx,y:-h-10,w:rw,h:h,v:v});}
function addObstacle(){var d=Math.min(time/45000,1);if(time>9000&&Math.random()<(.12+d*.12))spawnGate();else spawnSingle();}
function collide(b){var nx=Math.max(b.x,Math.min(player.x,b.x+b.w)),ny=Math.max(b.y,Math.min(player.y,b.y+b.h)),dx=player.x-nx,dy=player.y-ny;return dx*dx+dy*dy<player.r*player.r;}
function update(dt){time+=dt*1000;var d=Math.min(time/45000,1);spawn-=dt;if(spawn<=0){spawn=.68-d*.29;addObstacle();}
  var delta=player.targetX-player.x,maxStep=player.maxSpeed*dt;if(delta>maxStep)delta=maxStep;else if(delta<-maxStep)delta=-maxStep;player.x+=delta;player.x=Math.max(player.r+2,Math.min(W-player.r-2,player.x));
  for(var i=blocks.length-1;i>=0;i--){var b=blocks[i];b.y+=b.v*dt;if(collide(b)){endGame();return;}if(b.y>H+60)blocks.splice(i,1);}score=Math.floor(time/100);scoreEl.textContent=score;}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function draw(){ctx.clearRect(0,0,W,H);var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0d1832');bg.addColorStop(1,'#05080f');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(var s=0;s<stars.length;s++){var st=stars[s];ctx.globalAlpha=st.a;ctx.fillStyle='#dce9ff';ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=.08;ctx.strokeStyle='#7ea8ff';ctx.lineWidth=1;var gap=44,off=(time*.035)%gap;for(var y=-gap+off;y<H;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}for(var x=0;x<W;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}ctx.globalAlpha=1;for(var i=0;i<blocks.length;i++){var b=blocks[i];ctx.save();ctx.shadowColor='#ff4fa5';ctx.shadowBlur=18;ctx.fillStyle='#ff4fa5';rr(b.x,b.y,b.w,b.h,8);ctx.fill();ctx.restore();}ctx.save();ctx.shadowColor='#6ff8ff';ctx.shadowBlur=24;var g=ctx.createRadialGradient(player.x-4,player.y-5,2,player.x,player.y,player.r+5);g.addColorStop(0,'#fff');g.addColorStop(.35,'#7cf8ff');g.addColorStop(1,'#397dff');ctx.fillStyle=g;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.restore();}
function frame(now){var dt=last?Math.min((now-last)/1000,.033):0;last=now;if(started&&!dead&&!paused)update(dt);draw();requestAnimationFrame(frame);}function getX(e){if(e.touches&&e.touches.length)return e.touches[0].clientX;if(e.changedTouches&&e.changedTouches.length)return e.changedTouches[0].clientX;return e.clientX;}
function beginControl(e){if(e.target===pauseBtn)return;if(e.cancelable)e.preventDefault();if(paused){setPaused(false);return;}if(!started||dead)reset();dragging=true;lastTouchX=getX(e);}
function moveControl(e){if(e.cancelable)e.preventDefault();if(!dragging||!started||dead||paused)return;var x=getX(e),dx=(x-lastTouchX)*controlGain;lastTouchX=x;player.targetX=Math.max(player.r+2,Math.min(W-player.r-2,player.targetX+dx));}
function endControl(){dragging=false;player.targetX=player.x;}
function pausePress(e){if(e.cancelable)e.preventDefault();e.stopPropagation();setPaused(!paused);}
pauseBtn.addEventListener('touchstart',pausePress,{passive:false});pauseBtn.addEventListener('pointerdown',function(e){if(e.pointerType!=='touch')pausePress(e);});document.addEventListener('touchstart',beginControl,{passive:false});document.addEventListener('touchmove',moveControl,{passive:false});document.addEventListener('touchend',endControl,{passive:false});document.addEventListener('touchcancel',endControl,{passive:false});document.addEventListener('mousedown',beginControl);document.addEventListener('mousemove',function(e){if(e.buttons)moveControl(e);});document.addEventListener('mouseup',endControl);document.addEventListener('visibilitychange',function(){if(document.hidden&&started&&!dead&&!paused)setPaused(true);});resize();requestAnimationFrame(frame);
})();
</script></body></html>
