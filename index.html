<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>霓虹闪避 V0.9.1</title><body style="margin:0;background:#07101d"><script>(async()=>{const ps=['v091/c1.txt','v091/c2.txt','v091/c3.txt','v091/c4.txt'];let z=(await Promise.all(ps.map(p=>fetch(p+'?v=091').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()})))).join('');let b=Uint8Array.from(atob(z),c=>c.charCodeAt(0));let r=new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip')));let h=await r.text();document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML='<pre style="color:white;padding:20px">LOAD ERROR '+e+'</pre>'})</script>
