<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}body{position:fixed;inset:0}#gameWrap{position:fixed;inset:0;will-change:transform}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;inset:0;pointer-events:none;color:#fff}#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-weight:700;backdrop-filter:blur(10px)}#scorePill{justify-self:start}#stagePill{justify-self:center}#bestPill{justify-self:end}#pauseBtn{position:fixed;z-index:50;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:50%;font-size:17px;font-weight:900;display:none;align-items:center;justify-content:center;touch-action:manipulation;backdrop-filter:blur(10px)}#comboHud{position:absolute;top:max(66px,calc(env(safe-area-inset-top) + 60px));left:50%;transform:translateX(-50%) scale(.9);font-weight:900;font-size:18px;opacity:0;text-shadow:0 0 18px #7cf8ff,0 0 38px rgba(124,248,255,.6)}#comboHud.pop{animation:pop .32s ease-out}@keyframes pop{0%{transform:translateX(-50%) scale(.55);opacity:0}50%{transform:translateX(-50%) scale(1.22);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}#eventHud{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%) scale(.8);text-align:center;opacity:0;font-weight:900;text-shadow:0 0 24px rgba(255,180,240,.95),0 0 60px rgba(255,80,160,.55)}#eventHud.show{animation:eventIn 1.2s ease-out}@keyframes eventIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}68%{opacity:1}100%{opacity:0;transform:translate(-50%,-58%) scale(.96)}}#eventTitle{font-size:34px;letter-spacing:2px}#eventSub{font-size:12px;opacity:.75;margin-top:5px;letter-spacing:2px}#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:86%;max-width:380px;padding:26px 20px;border-radius:28px;background:rgba(8,16,31,.62);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.35)}#title{font-size:34px;font-weight:900;letter-spacing:2px}#text{margin-top:12px;opacity:.82;line-height:1.65;font-size:15px}#hint{margin-top:18px;font-size:18px;font-weight:800;animation:pulse 1.15s infinite}#tip{margin-top:10px;font-size:12px;opacity:.52}@keyframes pulse{50%{opacity:.32;transform:scale(.98)}}#debug{position:absolute;left:10px;bottom:max(10px,env(safe-area-inset-bottom));font:700 11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(0,0,0,.48);border:1px solid rgba(130,245,255,.25);padding:7px 8px;border-radius:9px;color:#aefaff;white-space:pre;display:none}

<div id="gameWrap"><canvas id="c"></canvas><div class="ui"><div id="top"><div class="pill" id="scorePill">分数 <span id="score">0</span></div><div class="pill" id="stagePill">STAGE <span id="stage">1</span></div><div class="pill" id="bestPill">最高 <span id="best">0</span></div></div><div id="comboHud"></div><div id="eventHud"><div id="eventTitle"></div><div id="eventSub"></div></div><div id="center"><div id="title">霓虹闪避</div><div id="text">自由移动躲避高速障碍，擦边连击会强化能量反馈。<br>特殊事件拥有独立预警、音效与演出。</div><div id="hint">触摸屏幕开始</div><div id="tip">V1.1.1 · EVENT HOTFIX</div></div><div id="debug"></div></div><button id="pauseBtn">Ⅱ</button></div>
<script>
(()=>{'use strict';
const wrap=document.getElementById('gameWrap'),c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),stageEl=document.getElementById('stage'),center=document.getElementById('center'),pauseBtn=document.getElementById('pauseBtn'),comboHud=document.getElementById('comboHud'),eventHud=document.getElementById('eventHud'),eventTitle=document.getElementById('eventTitle'),eventSub=document.getElementById('eventSub'),debugEl=document.getElementById('debug');
const DEBUG=new URLSearchParams(location.search).get('debug')==='1';
const STATE={NORMAL:'NORMAL',WARNING:'WARNING',ACTIVE:'ACTIVE',RECOVERY:'RECOVERY'};
const EVENT={NONE:null,METEOR:'METEOR',SIDE:'SIDE'};
let W=0,H=0,DPR=1,started=false,dead=false,paused=false,last=0,time=0,score=0,best=0,bonus=0,combo=0,comboTimer=0,grazeCount=0,maxCombo=0,flash=0,shakeT=0,shakeP=0,dragging=false,lastTouchX=0,lastTouchY=0,spawnT=.2,eventCooldown=9,eventMood=0,recoverT=0,nearDanger=0,quality=1,lowFpsT=0,fps=60,fpsAcc=0,fpsN=0,fpsWindow=0,eventClears=0,meteorClears=0,sideClears=0,eventStreak=0,stage=1,stageFlash=0,patternCount=0,blocks=[],particles=[],texts=[],stars=[],warnings=[],rings=[];
const pools={block:[],particle:[]};
const machine={state:STATE.NORMAL,type:EVENT.NONE,phase:0,t:0,total:0,max:0,data:null,rewarded:false};
const gain=1.05,p={x:0,y:0,r:14,targetX:0,targetY:0,maxSpeed:930,minY:90};
const STAGE_TIMES=[0,18000,38000,62000];
function stageData(n=stage){return n===1?{spawn:.36,speed:1.02,eventMin:7.2,eventRand:2.4,star:0,barGap:1,pattern:.06,label:'STAGE 1',sub:'RUSH START',top:'#0d1832',bottom:'#05080f',grid:'#7ea8ff',starSpeed:1}:n===2?{spawn:.315,speed:1.13,eventMin:6.2,eventRand:2.0,star:.1,barGap:.95,pattern:.24,label:'STAGE 2',sub:'PATTERNS ONLINE',top:'#171735',bottom:'#080916',grid:'#9a8cff',starSpeed:1.25}:n===3?{spawn:.275,speed:1.25,eventMin:5.4,eventRand:1.65,star:.18,barGap:.9,pattern:.42,label:'STAGE 3',sub:'DANGER ZONE',top:'#251536',bottom:'#0b0815',grid:'#d07dff',starSpeed:1.55}:{spawn:.24,speed:1.38,eventMin:4.7,eventRand:1.25,star:.28,barGap:.84,pattern:.58,label:'STAGE 4',sub:'OVERDRIVE',top:'#34132e',bottom:'#0d0712',grid:'#ff6db5',starSpeed:1.9}}
function currentStageByTime(){return time>=STAGE_TIMES[3]?4:time>=STAGE_TIMES[2]?3:time>=STAGE_TIMES[1]?2:1}
function syncStageUI(){if(stageEl)stageEl.textContent=stage}
function promoteStage(next){stage=next;stageFlash=.75;syncStageUI();bonus+=stage*6;shake(.14,5);sfx('clear');announce(stageData().label,stageData().sub)}
function applyStageProgress(){let next=currentStageByTime();if(next!==stage)promoteStage(next)}
let audioCtx=null,audioReady=false,audioUnlocked=false;
function initAudio(){if(audioCtx)return audioCtx;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();return audioCtx}catch(e){audioReady=false;return null}}
function unlockAudio(){const ac=initAudio();if(!ac)return;try{const b=ac.createBuffer(1,1,22050),src=ac.createBufferSource(),g=ac.createGain();src.buffer=b;g.gain.value=.00001;src.connect(g);g.connect(ac.destination);src.start(0)}catch(e){}const mark=()=>{audioReady=ac.state==='running';if(audioReady&&!audioUnlocked){audioUnlocked=true;tone(520,.045,'sine',.018,120)}};try{if(ac.state==='suspended'){const r=ac.resume();if(r&&r.then)r.then(mark).catch(()=>{})}else mark();ac.onstatechange=mark}catch(e){}}
function tone(freq=440,dur=.08,type='sine',vol=.035,slide=0,delay=0){const ac=audioCtx||initAudio();if(!ac)return;try{const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(40,freq),t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+dur);const out=Math.min(.12,vol*2.4);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,out),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function sfx(name){if(!audioCtx||audioCtx.state!=='running')return;if(name==='graze'){tone(760,.055,'sine',.025,240)}else if(name==='warning'){tone(220,.12,'square',.022,80);tone(330,.09,'sine',.018,120,.09)}else if(name==='meteor'){tone(150,.18,'sawtooth',.028,-55);tone(95,.22,'sine',.02,-25,.04)}else if(name==='shot'){tone(125,.11,'sawtooth',.04,420);tone(380,.06,'square',.018,220,.02)}else if(name==='clear'){tone(520,.08,'sine',.026,180);tone(760,.1,'sine',.024,210,.07)}else if(name==='streak'){tone(660,.07,'triangle',.023,190);tone(880,.08,'triangle',.023,210,.06);tone(1100,.09,'sine',.02,120,.12)}else if(name==='death'){tone(210,.14,'sawtooth',.04,-120);tone(120,.22,'square',.024,-60,.06)}}
try{best=+localStorage.getItem('neonBest')||0}catch(e){}bestEl.textContent=best;debugEl.style.display=DEBUG?'block':'none';
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);p.minY=Math.max(82,70+(parseFloat(getComputedStyle(document.documentElement).fontSize)||16));if(!p.x){p.x=p.targetX=W/2;p.y=p.targetY=H*.78}stars=[];for(let i=0,n=Math.max(44,Math.floor(W*H/10000));i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.3+Math.random()*1.5,a:.1+Math.random()*.55})}addEventListener('resize',resize);
function clampPlayer(){p.targetX=Math.max(p.r+4,Math.min(W-p.r-4,p.targetX));p.targetY=Math.max(p.minY+p.r,Math.min(H-p.r-8,p.targetY))}
function acquire(pool,obj){let o=pools[pool].pop()||{};for(const k in o)delete o[k];return Object.assign(o,obj)}
function release(pool,o){if(pools[pool].length<220)pools[pool].push(o)}
function clearObjects(){for(const b of blocks)release('block',b);blocks.length=0;for(const q of particles)release('particle',q);particles.length=0;texts.length=0;warnings.length=0;rings.length=0}
function resetMachine(){Object.assign(machine,{state:STATE.NORMAL,type:EVENT.NONE,phase:0,t:0,total:0,max:0,data:null,rewarded:false});eventMood=0}
function announce(title,sub){eventTitle.textContent=title;eventSub.textContent=sub;eventHud.classList.remove('show');void eventHud.offsetWidth;eventHud.classList.add('show')}
function shake(t=.1,pow=3){shakeT=Math.max(shakeT,t);shakeP=Math.max(shakeP,pow)}
function setPaused(v){if(!started||dead)return;paused=v;pauseBtn.textContent=v?'▶':'Ⅱ';if(v){center.style.display='block';center.querySelector('#title').textContent='已暂停';center.querySelector('#text').textContent='触摸屏幕或暂停按钮继续';center.querySelector('#hint').textContent='继续游戏'}else center.style.display='none'}
function reset(){clearObjects();resetMachine();started=true;dead=false;paused=false;time=0;score=0;bonus=0;combo=0;comboTimer=0;grazeCount=0;maxCombo=0;eventClears=0;meteorClears=0;sideClears=0;eventStreak=0;stage=1;patternCount=0;syncStageUI();spawnT=.18;eventCooldown=stageData().eventMin+Math.random()*stageData().eventRand;scoreEl.textContent='0';center.style.display='none';pauseBtn.style.display='flex';pauseBtn.textContent='Ⅱ';p.x=p.targetX=W/2;p.y=p.targetY=H*.78;dragging=false;announce('STAGE 1','RUSH START · PATTERN LANGUAGE')}
function endGame(){if(dead)return;dead=true;started=false;sfx('death');shake(.3,9);pauseBtn.style.display='none';if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neonBest',best)}catch(e){}}center.style.display='block';center.querySelector('#title').textContent='本局结束';center.querySelector('#text').innerHTML=`分数 <b>${score}</b> · 最高 STAGE <b>${stage}</b><br>擦边 ${grazeCount} · 最大 COMBO ${maxCombo}<br>事件通过 ${eventClears} · Pattern ${patternCount}`;center.querySelector('#hint').textContent='触摸重新开始';center.querySelector('#tip').textContent='V1.1.1 · EVENT HOTFIX'}
function makeBlock(o={}){return acquire('block',Object.assign({type:'rect',x:0,y:-50,w:30,h:30,radius:0,vx:0,vy:440,spin:0,angle:0,hitScale:.78,event:false,trail:false,grazed:false,entered:false,passed:false,minGap:1e9},o))}
function spawnRectAt(x,y,w=34,h=66,vy=440,vx=0){blocks.push(makeBlock({type:'rect',x,y,w,h,vy,vx,hitScale:.78}))}
function spawnStarAt(x,y=-50,vy=500,vx=0,r=28){blocks.push(makeBlock({type:'star',x,y,radius:r,w:r*2,h:r*2,vy,vx,spin:(Math.random()<.5?-1:1)*(3+Math.random()*3.5),hitScale:.76,elite:true}))}
function spawnCircle(){let r=15+Math.random()*20,m=stageData().speed;blocks.push(makeBlock({type:'circle',x:r+Math.random()*(W-r*2),y:-r-12,radius:r,w:r*2,h:r*2,vy:(390+Math.random()*135)*m,vx:(Math.random()-.5)*50,hitScale:.82}))}
function spawnHex(){let r=18+Math.random()*20,m=stageData().speed;blocks.push(makeBlock({type:'hex',x:r+Math.random()*(W-r*2),y:-r-12,radius:r,w:r*2,h:r*2,vy:(405+Math.random()*145)*m,vx:(Math.random()-.5)*90,spin:(Math.random()-.5)*4,hitScale:.8}))}
function spawnRect(){let w=24+Math.random()*40,h=42+Math.random()*74,m=stageData().speed;blocks.push(makeBlock({type:'rect',x:Math.random()*(W-w),y:-h-12,w,h,vy:(410+Math.random()*150)*m,vx:(Math.random()-.5)*35,hitScale:.78}))}
function spawnBar(){let gap=Math.max(92,(118+Math.random()*54)*stageData().barGap),left=Math.random()*(W-gap),h=34+Math.random()*22,m=stageData().speed;if(left>12)blocks.push(makeBlock({type:'bar',x:0,y:-h-10,w:left,h,vy:(390+Math.random()*110)*m,hitScale:.86}));if(left+gap<W-12)blocks.push(makeBlock({type:'bar',x:left+gap,y:-h-10,w:W-left-gap,h,vy:(390+Math.random()*110)*m,hitScale:.86}))}
function spawnStar(){let st=stageData(),m=st.speed,r=20+Math.random()*13,x=r+Math.random()*(W-2*r),drift=(Math.random()<.5?-1:1)*(18+Math.random()*32);spawnStarAt(x,-r-18,(385+Math.random()*125)*m,drift,r)}
function spawnPattern(){let m=stageData().speed,k=stage===2?Math.floor(Math.random()*3):Math.floor(Math.random()*5);patternCount++;if(k===0){let side=Math.random()<.5?-1:1;spawnRectAt(side<0?W*.12:W*.74,-70,W*.14,84,440*m,side*38);spawnRectAt(side<0?W*.62:W*.24,-150,W*.16,92,470*m,-side*30)}else if(k===1){let gap=Math.max(112,W*.32),x=W*.5-gap*.5;spawnRectAt(0,-55,x,42,440*m);spawnRectAt(x+gap,-55,W-x-gap,42,440*m);spawnStarAt(W*.5,-145,500*m,(Math.random()-.5)*28,24)}else if(k===2){spawnStarAt(W*.28,-70,455*m,52,25);spawnStarAt(W*.72,-145,455*m,-52,25)}else if(k===3){spawnRectAt(W*.05,-60,W*.18,64,465*m,68);spawnRectAt(W*.77,-145,W*.18,64,465*m,-68);spawnStarAt(W*.5,-225,500*m,0,22)}else{let lane=Math.random()<.5?W*.28:W*.72;spawnStarAt(lane,-70,500*m,(W*.5-lane)*.12,27);spawnRectAt(lane<W*.5?W*.58:W*.12,-155,W*.2,78,470*m,0);blocks.push(makeBlock({type:'hex',x:lane<W*.5?W*.78:W*.22,y:-245,radius:25,w:50,h:50,vy:515*m,vx:lane<W*.5?-42:42,spin:3.4,hitScale:.8}))}}
function spawnNormal(){let st=stageData(),r=Math.random();if(stage>=2&&r<st.pattern){spawnPattern();return}let shape=Math.random();if(stage>=2&&shape<st.star)spawnStar();else if(shape<.28)spawnCircle();else if(shape<.5)spawnHex();else if(shape<.82)spawnRect();else spawnBar()}
function addWarning(o){warnings.push(Object.assign({life:1,max:1},o));if(warnings.length>10)warnings.shift()}
function transition(state){machine.state=state;machine.t=0;machine.phase=0}
function startEvent(kind){if(machine.state!==STATE.NORMAL||machine.type)return;for(const b of blocks)release('block',b);blocks.length=0;warnings.length=0;machine.type=kind;machine.total=0;machine.rewarded=false;machine.data={};eventMood=0;recoverT=0;spawnT=999;if(kind===EVENT.METEOR){machine.max=6.2;machine.data.dir=Math.random()<.5?1:-1;machine.data.seed=Math.random()*Math.PI*2;warnings.push({type:'diag',life:1.12,max:1.12,dir:machine.data.dir,curveSeed:machine.data.seed});announce('WARNING','POLYGON STORM · 跟住安全通道')}else{machine.max=5.8;machine.data.firstSide=Math.random()<.5?'left':'right';warnings.push({type:'side',side:machine.data.firstSide,band:'low',life:1.0,max:1.0});announce('WARNING','SIDE BARRAGE · 看左右充能')}transition(STATE.WARNING);sfx('warning');if(navigator.vibrate)try{navigator.vibrate(24)}catch(e){}}
function rewardEvent(label){if(machine.rewarded)return;machine.rewarded=true;for(let i=blocks.length-1;i>=0;i--){if(blocks[i].event){release('block',blocks[i]);blocks.splice(i,1)}}warnings.length=0;let add=45;bonus+=add;eventClears++;eventStreak++;if(machine.type===EVENT.METEOR)meteorClears++;if(machine.type===EVENT.SIDE)sideClears++;texts.push({x:p.x,y:p.y-30,t:label+' +'+add,life:1.05,max:1.05,big:true});if(eventStreak>=2)texts.push({x:p.x,y:p.y-54,t:'EVENT STREAK ×'+eventStreak,life:1.1,max:1.1,big:true});burst(p.x,p.y,22);addRing(p.x,p.y,p.r+8,.55,1.25);shake(.14,5);sfx('clear');if(eventStreak>=2)sfx('streak');announce(label,eventStreak>=2?'EVENT STREAK ×'+eventStreak+' · +'+add:'事件通过 +'+add);transition(STATE.RECOVERY);recoverT=.85;eventCooldown=stageData().eventMin+Math.random()*stageData().eventRand;spawnT=stageData().spawn+.18;warnings.length=0}
function abortEvent(reason){warnings.length=0;for(let i=blocks.length-1;i>=0;i--){if(blocks[i].event){release('block',blocks[i]);blocks.splice(i,1)}}announce('SYSTEM RECOVERY',reason||'事件异常 · 已安全退出');machine.type=EVENT.NONE;machine.data=null;machine.rewarded=true;transition(STATE.RECOVERY);recoverT=.9;eventCooldown=stageData().eventMin+.8;spawnT=stageData().spawn+.2}
function spawnMeteorWave(){sfx('meteor');let dir=machine.data.dir,seed=machine.data.seed,cols=Math.ceil(W/42)+6,rows=9,gapCol=Math.floor(3+Math.random()*Math.max(2,cols-7)),gapHalf=Math.max(2.35,Math.min(2.85,W/158));for(let r=0;r<rows;r++){let bend=Math.sin(seed+r*.82)*.55;for(let col=-3;col<cols;col++){let shifted=col+r*dir*.52+bend;if(Math.abs(shifted-gapCol)<gapHalf)continue;let rad=13+Math.random()*7,x=shifted*42+20,y=-80-r*47-Math.random()*10;blocks.push(makeBlock({type:'meteor',x,y,radius:rad,w:rad*2,h:rad*2,vx:dir*(96+Math.random()*26),vy:322+Math.random()*48,spin:(Math.random()<.5?-1:1)*(1.8+Math.random()*2),event:true,trail:true,hitScale:.78}))}}}
function spawnSideShot(side,band){sfx('shot');let y=band==='low'?H*.73:H*.29,h=26,w=Math.max(118,W*.3),speed=band==='low'?650:710,left=side==='left',x=left?-w-12:W+12,vx=left?speed:-speed;blocks.push(makeBlock({type:'shot',x,y,w,h,vx,vy:0,event:true,trail:true,hitScale:.78}))}
function updateMachine(dt){machine.t+=dt;machine.total+=dt;if(machine.type&&machine.state!==STATE.RECOVERY&&machine.total>machine.max){abortEvent('超时保险触发');return}eventMood+=((machine.type?1:0)-eventMood)*Math.min(1,dt*4);if(machine.state===STATE.NORMAL){eventCooldown-=dt;if(eventCooldown<=0&&time>7000)startEvent(Math.random()<.52?EVENT.METEOR:EVENT.SIDE);return}if(machine.state===STATE.RECOVERY){recoverT-=dt;if(recoverT<=0){machine.type=EVENT.NONE;machine.data=null;transition(STATE.NORMAL)}return}if(machine.type===EVENT.METEOR){if(machine.state===STATE.WARNING&&machine.t>=1.02){warnings.length=0;spawnMeteorWave();transition(STATE.ACTIVE);shake(.1,3.5)}else if(machine.state===STATE.ACTIVE&&machine.t>=4.0)rewardEvent('RAIN CLEAR');return}if(machine.type===EVENT.SIDE){if(machine.state===STATE.WARNING&&machine.phase===0&&machine.t>=.98){spawnSideShot(machine.data.firstSide||'left','low');warnings.length=0;transition(STATE.ACTIVE);machine.phase=1;shake(.08,3);return}if(machine.state===STATE.ACTIVE&&machine.phase===1&&machine.t>=.62){machine.data.secondSide=Math.random()<.5?'left':'right';warnings=[{type:'side',side:machine.data.secondSide,band:'high',life:1.02,max:1.02}];machine.phase=2;machine.t=0;return}if(machine.state===STATE.ACTIVE&&machine.phase===2&&machine.t>=.96){spawnSideShot(machine.data.secondSide||'right','high');warnings.length=0;machine.phase=3;machine.t=0;shake(.08,3);return}if(machine.state===STATE.ACTIVE&&machine.phase===3&&machine.t>=1.2)rewardEvent('BARRAGE CLEAR')}
function hitDist(b){if(['circle','hex','meteor','star'].includes(b.type))return Math.hypot(p.x-b.x,p.y-b.y)-b.radius*b.hitScale;let inset=(1-b.hitScale)*Math.min(b.w,b.h)*.5,x1=b.x+inset,y1=b.y+inset,x2=b.x+b.w-inset,y2=b.y+b.h-inset,cx=Math.max(x1,Math.min(p.x,x2)),cy=Math.max(y1,Math.min(p.y,y2));return Math.hypot(p.x-cx,p.y-cy)}
