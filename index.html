<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#07101d"><title>霓虹闪避 V0.5</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}body{position:fixed;inset:0}#gameWrap{position:fixed;inset:0;will-change:transform}canvas{display:block;width:100vw;height:100vh}.ui{position:fixed;inset:0;pointer-events:none;color:#fff}#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);font-weight:700;backdrop-filter:blur(10px)}#scorePill{justify-self:start}#bestPill{justify-self:end}#pauseBtn{position:fixed;z-index:50;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:50%;font-size:17px;font-weight:900;display:none;align-items:center;justify-content:center;touch-action:manipulation;backdrop-filter:blur(10px)}#comboHud{position:absolute;top:max(66px,calc(env(safe-area-inset-top) + 60px));left:50%;transform:translateX(-50%) scale(.9);font-weight:900;font-size:18px;opacity:0;text-shadow:0 0 18px #7cf8ff,0 0 38px rgba(124,248,255,.6)}#comboHud.pop{animation:pop .32s ease-out}@keyframes pop{0%{transform:translateX(-50%) scale(.55);opacity:0}50%{transform:translateX(-50%) scale(1.22);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}#levelHud{position:absolute;left:50%;top:37%;transform:translate(-50%,-50%) scale(.8);text-align:center;opacity:0;font-weight:900;text-shadow:0 0 24px rgba(154,210,255,.95),0 0 55px rgba(161,121,255,.55)}#levelHud.show{animation:levelIn 1.35s ease-out}@keyframes levelIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.55)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}65%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-56%) scale(.96)}}#levelNum{font-size:36px;letter-spacing:2px}#levelSub{font-size:13px;opacity:.72;margin-top:4px;letter-spacing:2px}#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:86%;max-width:380px;padding:26px 20px;border-radius:28px;background:rgba(8,16,31,.6);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.35)}#title{font-size:34px;font-weight:900;letter-spacing:2px}#text{margin-top:12px;opacity:.8;line-height:1.65;font-size:15px}#hint{margin-top:18px;font-size:18px;font-weight:800;animation:pulse 1.15s infinite}#tip{margin-top:10px;font-size:12px;opacity:.52}@keyframes pulse{50%{opacity:.32;transform:scale(.98)}}
</style></head><body><div id="gameWrap"><canvas id="c"></canvas><div class="ui"><div id="top"><div class="pill" id="scorePill">分数 <span id="score">0</span></div><div></div><div class="pill" id="bestPill">最高 <span id="best">0</span></div></div><div id="comboHud"></div><div id="levelHud"><div id="levelNum"></div><div id="levelSub"></div></div><div id="center"><div id="title">霓虹闪避</div><div id="text">左右滑动控制能量球，躲开不同形态障碍。<br>擦边可加分，越往后障碍越复杂。</div><div id="hint">触摸屏幕开始</div><div id="tip">V0.5 · 阶段与多形态障碍</div></div></div><button id="pauseBtn">Ⅱ</button></div><script>
(()=>{'use strict';
const wrap=document.getElementById('gameWrap'),c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),center=document.getElementById('center'),pauseBtn=document.getElementById('pauseBtn'),comboHud=document.getElementById('comboHud'),levelHud=document.getElementById('levelHud'),levelNum=document.getElementById('levelNum'),levelSub=document.getElementById('levelSub');
let W=0,H=0,DPR=1,started=false,dead=false,paused=false,last=0,time=0,spawn=0,score=0,best=0,bonus=0,combo=0,comboTimer=0,flash=0,shakeT=0,shakeP=0,stage=1,grazeCount=0,maxCombo=0,dragging=false,lastTouchX=0,particles=[],texts=[],blocks=[],stars=[];const gain=1.15,p={x:0,y:0,r:14,targetX:0,maxSpeed:760};try{best=+localStorage.getItem('neonBest')||0}catch(e){}bestEl.textContent=best;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);p.y=H*.82;if(!p.x)p.x=p.targetX=W/2;stars=[];for(let i=0,n=Math.max(40,Math.floor(W*H/11000));i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.3+Math.random()*1.4,a:.12+Math.random()*.5})}addEventListener('resize',resize);
function getStage(){let s=time<15000?1:time<30000?2:time<45000?3:time<60000?4:5;return s}function stageName(s){return['','BASE','DRIFT','POLYGON','BLOCKADE','OVERDRIVE'][s]}function announce(s){levelNum.textContent=s===5?'OVERDRIVE':'LEVEL '+s;levelSub.textContent=stageName(s);levelHud.classList.remove('show');void levelHud.offsetWidth;levelHud.classList.add('show');if(navigator.vibrate)try{navigator.vibrate(28)}catch(e){}}
function reset(){started=true;dead=false;paused=false;last=performance.now();time=0;spawn=.42;score=bonus=combo=comboTimer=flash=shakeT=shakeP=grazeCount=maxCombo=0;stage=1;blocks=[];particles=[];texts=[];p.x=p.targetX=W/2;p.y=H*.82;scoreEl.textContent='0';comboHud.style.opacity='0';center.style.display='none';pauseBtn.style.display='flex';pauseBtn.textContent='Ⅱ';wrap.style.transform='translate3d(0,0,0)';announce(1)}
function setPaused(v){if(!started||dead)return;paused=v;dragging=false;pauseBtn.textContent=v?'▶':'Ⅱ';if(v){center.style.display='block';center.innerHTML='<div id="title">已暂停</div><div id="text">分数 '+score+'<br>当前 LEVEL '+stage+'</div><div id="hint">点屏幕继续</div>'}else{center.style.display='none';last=performance.now()}}
function shake(t,pow){shakeT=Math.max(shakeT,t);shakeP=Math.max(shakeP,pow)}function endGame(){if(dead)return;dead=true;started=false;pauseBtn.style.display='none';comboHud.style.opacity='0';shake(.22,12);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neonBest',best)}catch(e){}}let secs=(time/1000).toFixed(1);center.style.display='block';center.innerHTML='<div id="title">撞到了</div><div id="text">本局 <b>'+score+'</b> 分<br>生存 '+secs+' 秒 · LEVEL '+stage+'<br>擦边 '+grazeCount+' 次 · 最高 COMBO ×'+maxCombo+'<br>擦边奖励 +'+bonus+'</div><div id="hint">点一下重新开始</div><div id="tip">下一局试着冲更高阶段</div>';if(navigator.vibrate)try{navigator.vibrate([28,28,72])}catch(e){}}
function base(o){return Object.assign({type:'rect',x:0,y:-60,w:60,h:28,v:230,vx:0,angle:0,spin:0,radius:0,grazed:false,entered:false,passed:false,minGap:9999},o)}
function spawnRect(){let d=Math.min(time/65000,1),w=42+Math.random()*68,h=18+Math.random()*26,x=Math.random()*(W-w);blocks.push(base({type:'rect',x,y:-h-12,w,h,v:225+d*220+Math.random()*65}))}
function spawnCircle(){let r=18+Math.random()*15,x=r+Math.random()*(W-2*r),dir=Math.random()<.5?-1:1;blocks.push(base({type:'circle',x,y:-r-15,radius:r,w:r*2,h:r*2,v:225+Math.random()*70,vx:dir*(38+Math.random()*48)}))}
function spawnHex(){let r=22+Math.random()*16,x=r+Math.random()*(W-2*r);blocks.push(base({type:'hex',x,y:-r-18,radius:r,w:r*2,h:r*2,v:245+Math.random()*75,spin:(Math.random()<.5?-1:1)*(1.2+Math.random()*1.7)}))}
function spawnBar(){let gap=Math.max(110,Math.min(150,W*.34)),gapX=20+Math.random()*Math.max(1,W-gap-40),h=23+Math.random()*16,v=245+Math.random()*45;if(gapX>28)blocks.push(base({type:'bar',x:0,y:-h-12,w:gapX,h,v}));let rx=gapX+gap;if(W-rx>28)blocks.push(base({type:'bar',x:rx,y:-h-12,w:W-rx,h,v}))}
function spawnGate(){let gap=Math.max(100,Math.min(140,W*.3)),gx=10+Math.random()*Math.max(1,W-gap-20),h=20,v=230+Math.random()*40;if(gx>25)blocks.push(base({type:'rect',x:0,y:-30,w:gx,h,v}));if(W-gx-gap>25)blocks.push(base({type:'rect',x:gx+gap,y:-30,w:W-gx-gap,h,v}))}
function addObstacle(){let r=Math.random();if(stage===1){spawnRect()}else if(stage===2){r<.42?spawnCircle():r<.9?spawnRect():spawnGate()}else if(stage===3){r<.3?spawnCircle():r<.62?spawnHex():r<.92?spawnRect():spawnGate()}else if(stage===4){r<.24?spawnCircle():r<.48?spawnHex():r<.72?spawnBar():r<.9?spawnRect():spawnGate()}else{r<.2?spawnCircle():r<.4?spawnHex():r<.62?spawnBar():r<.86?spawnRect():spawnGate()}}
function rectDist(b){let nx=Math.max(b.x,Math.min(p.x,b.x+b.w)),ny=Math.max(b.y,Math.min(p.y,b.y+b.h)),dx=p.x-nx,dy=p.y-ny;return Math.hypot(dx,dy)}function circleDist(b){return Math.hypot(p.x-b.x,p.y-b.y)-b.radius}function hitDist(b){return b.type==='circle'||b.type==='hex'?circleDist(b):rectDist(b)}function hGap(b){if(b.type==='circle'||b.type==='hex')return Math.abs(p.x-b.x)-b.radius;if(p.x<b.x)return b.x-p.x;if(p.x>b.x+b.w)return p.x-(b.x+b.w);return 0}
function burst(){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,s=55+Math.random()*125;particles.push({x:p.x,y:p.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-25,life:.55,max:.55,size:2+Math.random()*3})}}function popCombo(){comboHud.classList.remove('pop');void comboHud.offsetWidth;comboHud.classList.add('pop')}
function graze(b){if(b.grazed)return;b.grazed=true;grazeCount++;combo++;maxCombo=Math.max(maxCombo,combo);comboTimer=2.2;let add=10+Math.min(combo-1,10)*3;bonus+=add;flash=.18;shake(.11,combo>=5?5:3.4);burst();texts.push({x:p.x,y:p.y-28,t:'擦边 +'+add,life:.82,max:.82});comboHud.textContent=combo>1?'COMBO ×'+combo:'擦边';comboHud.style.opacity='1';popCombo();if(navigator.vibrate)try{navigator.vibrate(16)}catch(e){}}
function update(dt){time+=dt*1000;let ns=getStage();if(ns!==stage){stage=ns;announce(stage)}let speedMul=stage===5?1.12:1;spawn-=dt;if(spawn<=0){let baseInt=[0,.72,.66,.6,.55,.48][stage];spawn=baseInt*(.82+Math.random()*.35);addObstacle()}if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=0;comboHud.style.opacity='0'}}if(flash>0)flash-=dt;if(shakeT>0){shakeT-=dt;let k=Math.min(1,shakeT/.11),dx=(Math.random()*2-1)*shakeP*k,dy=(Math.random()*2-1)*shakeP*.7*k;wrap.style.transform='translate3d('+dx+'px,'+dy+'px,0)';shakeP*=.92}else wrap.style.transform='translate3d(0,0,0)';let dx=p.targetX-p.x,ms=p.maxSpeed*dt;if(dx>ms)dx=ms;if(dx<-ms)dx=-ms;p.x=Math.max(p.r+2,Math.min(W-p.r-2,p.x+dx));
for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];b.y+=b.v*speedMul*dt;b.x+=b.vx*dt;b.angle+=b.spin*dt;if((b.type==='circle'||b.type==='hex')&&(b.x<b.radius||b.x>W-b.radius)){b.vx*=-1;b.x=Math.max(b.radius,Math.min(W-b.radius,b.x))}if(hitDist(b)<p.r){endGame();return}let top=b.type==='circle'||b.type==='hex'?b.y-b.radius:b.y,bottom=b.type==='circle'||b.type==='hex'?b.y+b.radius:b.y+b.h,over=top<=p.y+p.r&&bottom>=p.y-p.r;if(over){b.entered=true;let g=hGap(b);if(g>0)b.minGap=Math.min(b.minGap,g)}if(b.entered&&!b.passed&&top>p.y+p.r){b.passed=true;if(b.minGap>p.r&&b.minGap<=p.r+34)graze(b);else b.grazed=true}if(top>H+70)blocks.splice(i,1)}
for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt;texts[i].y-=44*dt;if(texts[i].life<=0)texts.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=180*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1)}score=Math.floor(time/100)+bonus;scoreEl.textContent=score}
function poly(cx,cy,r,n,a){ctx.beginPath();for(let i=0;i<n;i++){let q=a+i*Math.PI*2/n,px=cx+Math.cos(q)*r,py=cy+Math.sin(q)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawObstacle(b){ctx.save();let col=b.type==='circle'?'#ff74d4':b.type==='hex'?'#b987ff':b.type==='bar'?'#ff4f8f':'#ff4fa5';ctx.shadowColor=col;ctx.shadowBlur=18;ctx.fillStyle=col;if(b.type==='circle'){ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.stroke()}else if(b.type==='hex'){poly(b.x,b.y,b.radius,6,b.angle);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.32)';ctx.lineWidth=2;ctx.stroke()}else{rr(b.x,b.y,b.w,b.h,b.type==='bar'?11:8);ctx.fill()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let t=Math.min(1,(stage-1)/4),bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,stage>=4?'#201143':stage>=3?'#17163b':'#0d1832');bg.addColorStop(1,stage===5?'#100511':'#05080f');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let s of stars){ctx.globalAlpha=s.a;ctx.fillStyle=stage>=4?'#eadfff':'#dce9ff';ctx.beginPath();ctx.arc(s.x,(s.y+time*(.006+stage*.002))%H,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=.07+.02*t;ctx.strokeStyle=stage>=4?'#b995ff':'#7ea8ff';let grid=44,off=(time*(.035+stage*.007))%grid;for(let y=off-grid;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}ctx.globalAlpha=1;blocks.forEach(drawObstacle);for(let q of particles){ctx.save();ctx.globalAlpha=q.life/q.max;ctx.fillStyle='#b5fbff';ctx.shadowColor='#8ffcff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.save();ctx.shadowColor=flash>0?'#fff':'#6ff8ff';ctx.shadowBlur=flash>0?40:24;let g=ctx.createRadialGradient(p.x-4,p.y-5,2,p.x,p.y,p.r+5);g.addColorStop(0,'#fff');g.addColorStop(.35,'#7cf8ff');g.addColorStop(1,'#397dff');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();for(let q of texts){let pr=1-q.life/q.max,a=pr<.2?pr/.2:1-Math.max(0,(pr-.35)/.65),sc=pr<.32?.72+pr/.32*.58:1.3-(pr-.32)*.45;ctx.save();ctx.globalAlpha=Math.max(0,a);ctx.translate(q.x,q.y);ctx.scale(sc,sc);ctx.fillStyle='#a9fbff';ctx.shadowColor='#8ffcff';ctx.shadowBlur=18;ctx.font='900 16px sans-serif';ctx.textAlign='center';ctx.fillText(q.t,0,0);ctx.restore()}}
function frame(now){let dt=last?Math.min((now-last)/1000,.033):0;last=now;if(started&&!dead&&!paused)update(dt);draw();requestAnimationFrame(frame)}function getX(e){if(e.touches&&e.touches.length)return e.touches[0].clientX;if(e.changedTouches&&e.changedTouches.length)return e.changedTouches[0].clientX;return e.clientX}function begin(e){if(e.target===pauseBtn)return;if(e.cancelable)e.preventDefault();if(paused){setPaused(false);return}if(!started||dead)reset();dragging=true;lastTouchX=getX(e)}function move(e){if(e.cancelable)e.preventDefault();if(!dragging||!started||dead||paused)return;let X=getX(e),d=(X-lastTouchX)*gain;lastTouchX=X;p.targetX=Math.max(p.r+2,Math.min(W-p.r-2,p.targetX+d))}function stop(){dragging=false;p.targetX=p.x}function pp(e){if(e.cancelable)e.preventDefault();e.stopPropagation();setPaused(!paused)}pauseBtn.addEventListener('touchstart',pp,{passive:false});pauseBtn.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')pp(e)});document.addEventListener('touchstart',begin,{passive:false});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',stop,{passive:false});document.addEventListener('touchcancel',stop,{passive:false});document.addEventListener('mousedown',begin);document.addEventListener('mousemove',e=>{if(e.buttons)move(e)});document.addEventListener('mouseup',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!dead&&!paused)setPaused(true)});resize();requestAnimationFrame(frame)})();
</script></body></html>
