<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07101d">
<title>霓虹闪避</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
body{position:fixed;inset:0}
#gameWrap{position:fixed;inset:0;transform:translate3d(0,0,0);will-change:transform}
canvas{display:block;width:100vw;height:100vh}
.ui{position:fixed;inset:0;pointer-events:none;color:#fff}
#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#scorePill{justify-self:start}#bestPill{justify-self:end}
#comboHud{position:absolute;top:max(66px,calc(env(safe-area-inset-top) + 60px));left:50%;transform:translateX(-50%) scale(.86);font-weight:900;font-size:18px;opacity:0;color:#f8fdff;text-shadow:0 0 16px rgba(124,248,255,.92),0 0 38px rgba(124,248,255,.55)}
#comboHud.show{opacity:1}#comboHud.pop{animation:comboPop .32s ease-out}
@keyframes comboPop{0%{transform:translateX(-50%) scale(.55);opacity:0}45%{transform:translateX(-50%) scale(1.22);opacity:1}100%{transform:translateX(-50%) scale(1);opacity:1}}
#pauseBtn{position:fixed;z-index:50;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);pointer-events:auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;width:44px;height:44px;border-radius:50%;font-size:17px;font-weight:900;display:none;align-items:center;justify-content:center;touch-action:manipulation;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);-webkit-tap-highlight-color:transparent}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:86%;max-width:380px;padding:26px 20px;border-radius:28px;background:rgba(8,16,31,.58);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
#title{font-size:34px;font-weight:900;letter-spacing:2px}#text{margin-top:12px;opacity:.8;line-height:1.65;font-size:15px}#hint{margin-top:18px;font-size:18px;font-weight:800;animation:pulse 1.15s infinite}#tip{margin-top:10px;font-size:12px;opacity:.5}@keyframes pulse{50%{opacity:.32;transform:scale(.98)}}
</style>
</head>
<body>
<div id="gameWrap">
<canvas id="c"></canvas>
<div class="ui"><div id="top"><div class="pill" id="scorePill">分数 <span id="score">0</span></div><div></div><div class="pill" id="bestPill">最高 <span id="best">0</span></div></div><div id="comboHud"></div><div id="center"><div id="title">霓虹闪避</div><div id="text">左右滑动控制蓝色小球。<br>从障碍边缘惊险穿过，会触发擦边奖励。</div><div id="hint">触摸屏幕开始</div><div id="tip">连续擦边会提高 Combo</div></div></div>
<button id="pauseBtn" aria-label="暂停">Ⅱ</button>
</div>
<script>
(function(){'use strict';
const wrap=document.getElementById('gameWrap'),c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),center=document.getElementById('center'),pauseBtn=document.getElementById('pauseBtn'),comboHud=document.getElementById('comboHud');
let W=0,H=0,DPR=1,started=false,dead=false,paused=false,last=0,time=0,spawn=0,score=0,best=0,bonus=0,combo=0,comboTimer=0,flash=0,shakeTime=0,shakePower=0;
try{best=parseInt(localStorage.getItem('neonBest')||'0',10)||0}catch(e){}bestEl.textContent=best;
const p={x:0,y:0,r:14,targetX:0,maxSpeed:760};let blocks=[],stars=[],texts=[],particles=[],lastSpawnX=null,dragging=false,lastTouchX=0;const controlGain=1.15;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=Math.floor(W*DPR);c.height=Math.floor(H*DPR);c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);p.y=H*.82;if(!p.x){p.x=W/2;p.targetX=W/2}stars=[];for(let i=0,n=Math.max(35,Math.floor(W*H/12000));i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,a:Math.random()*.55+.15})}
addEventListener('resize',resize);
function reset(){started=true;dead=false;paused=false;dragging=false;last=performance.now();time=0;spawn=.35;score=0;bonus=0;combo=0;comboTimer=0;flash=0;shakeTime=0;shakePower=0;blocks=[];texts=[];particles=[];lastSpawnX=null;p.x=W/2;p.targetX=W/2;p.y=H*.82;scoreEl.textContent='0';comboHud.classList.remove('show','pop');comboHud.style.opacity='0';center.style.display='none';pauseBtn.style.display='flex';pauseBtn.textContent='Ⅱ';wrap.style.transform='translate3d(0,0,0)'}
function setPaused(v){if(!started||dead)return;paused=v;dragging=false;pauseBtn.textContent=v?'▶':'Ⅱ';if(v){center.style.display='block';center.innerHTML='<div id="title">已暂停</div><div id="text">分数 '+score+'<br>进度已保留。</div><div id="hint">点屏幕继续</div><div id="tip">也可以点顶部 ▶</div>'}else{center.style.display='none';last=performance.now()}}
function triggerShake(duration,power){shakeTime=Math.max(shakeTime,duration);shakePower=Math.max(shakePower,power)}
function endGame(){if(dead)return;dead=true;started=false;paused=false;dragging=false;pauseBtn.style.display='none';comboHud.classList.remove('show','pop');comboHud.style.opacity='0';triggerShake(.22,12);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neonBest',String(best))}catch(e){}}center.style.display='block';center.innerHTML='<div id="title">撞到了</div><div id="text">本局 <b>'+score+'</b> 分<br>擦边奖励 <b>'+bonus+'</b><br>最高 <b>'+best+'</b> 分</div><div id="hint">点一下重新开始</div><div id="tip">敢贴近，才有高分</div>';if(navigator.vibrate)try{navigator.vibrate([24,26,64])}catch(e){}}
function mk(X,Y,w,h,v){return{x:X,y:Y,w:w,h:h,v:v,grazed:false,minGap:9999,entered:false,passed:false}}
function spawnSingle(){let d=Math.min(time/45000,1),w=42+Math.random()*(55+d*22),h=18+Math.random()*26,r=Math.random(),X;if(r<.36)X=p.x-w/2+(Math.random()-.5)*70;else if(r<.66){let left=Math.random()<.5,z=Math.max(28,W*.22);X=left?Math.random()*z:W-w-Math.random()*z}else X=Math.random()*(W-w);X=Math.max(0,Math.min(W-w,X));if(lastSpawnX!==null&&Math.abs(X-lastSpawnX)<22&&Math.random()<.7)X=(X+W*.42)%Math.max(1,W-w);lastSpawnX=X;blocks.push(mk(X,-h-10,w,h,220+d*245+Math.random()*80))}
function spawnGate(){let d=Math.min(time/45000,1),gw=Math.max(92-p.r*2,Math.min(132,W*.28)),m=8,gc=m+gw/2+Math.random()*Math.max(1,W-2*m-gw),lw=gc-gw/2,rx=gc+gw/2,rw=W-rx,h=20+Math.random()*16,v=215+d*235;if(lw>18)blocks.push(mk(0,-h-10,lw,h,v));if(rw>18)blocks.push(mk(rx,-h-10,rw,h,v))}
function addObs(){let d=Math.min(time/45000,1);if(time>9000&&Math.random()<.12+d*.12)spawnGate();else spawnSingle()}
function circleRectDist(b){let nx=Math.max(b.x,Math.min(p.x,b.x+b.w)),ny=Math.max(b.y,Math.min(p.y,b.y+b.h)),dx=p.x-nx,dy=p.y-ny;return Math.sqrt(dx*dx+dy*dy)}
function horizontalGap(b){if(p.x<b.x)return b.x-p.x;if(p.x>b.x+b.w)return p.x-(b.x+b.w);return 0}
function popComboHud(){comboHud.classList.remove('pop');void comboHud.offsetWidth;comboHud.classList.add('pop')}
function spawnBurst(cx,cy){for(let i=0;i<12;i++){let a=Math.random()*Math.PI*2,s=60+Math.random()*125;particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.38+Math.random()*.24,maxLife:.62,size:2+Math.random()*3})}}
function graze(b){if(b.grazed)return;b.grazed=true;combo++;comboTimer=2.15;let add=10+Math.min(combo-1,9)*3;bonus+=add;flash=.18;triggerShake(.11,combo>1?4.2:3.2);spawnBurst(p.x,p.y);texts.push({x:p.x,y:p.y-28,text:'擦边 +'+add,life:.82,maxLife:.82});comboHud.textContent=combo>1?'COMBO ×'+combo:'擦边';comboHud.classList.add('show');comboHud.style.opacity='1';popComboHud();if(navigator.vibrate)try{navigator.vibrate(18)}catch(e){}}
function update(dt){time+=dt*1000;let d=Math.min(time/45000,1);spawn-=dt;if(spawn<=0){spawn=.68-d*.29;addObs()}if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=0;comboHud.classList.remove('show');comboHud.style.opacity='0'}}if(flash>0)flash-=dt;if(shakeTime>0){shakeTime-=dt;let k=Math.max(0,shakeTime/.12),dx=(Math.random()*2-1)*shakePower*k,dy=(Math.random()*2-1)*shakePower*.7*k;wrap.style.transform='translate3d('+dx+'px,'+dy+'px,0)';shakePower*=.93}else wrap.style.transform='translate3d(0,0,0)';let del=p.targetX-p.x,ms=p.maxSpeed*dt;if(del>ms)del=ms;else if(del<-ms)del=-ms;p.x+=del;p.x=Math.max(p.r+2,Math.min(W-p.r-2,p.x));for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];b.y+=b.v*dt;let dist=circleRectDist(b);if(dist<p.r){endGame();return}let overlapsY=(b.y<=p.y+p.r&&b.y+b.h>=p.y-p.r);if(overlapsY){b.entered=true;let hg=horizontalGap(b);if(hg<b.minGap)b.minGap=hg}if(b.entered&&!b.passed&&b.y>p.y+p.r){b.passed=true;if(!b.grazed&&b.minGap>p.r&&b.minGap<=p.r+34)graze(b)}if(b.y>H+60)blocks.splice(i,1)}for(let i=texts.length-1;i>=0;i--){texts[i].y-=44*dt;texts[i].life-=dt;if(texts[i].life<=0)texts.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=180*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1)}score=Math.floor(time/100)+bonus;scoreEl.textContent=score}
function rr(X,Y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(X+r,Y);ctx.arcTo(X+w,Y,X+w,Y+h,r);ctx.arcTo(X+w,Y+h,X,Y+h,r);ctx.arcTo(X,Y+h,X,Y,r);ctx.arcTo(X,Y,X+w,Y,r);ctx.closePath()}
function draw(){ctx.clearRect(0,0,W,H);let bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0d1832');bg.addColorStop(1,'#05080f');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#dce9ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=.08;ctx.strokeStyle='#7ea8ff';ctx.lineWidth=1;for(let gy=(time*.035)%44-44;gy<H;gy+=44){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}for(let gx=0;gx<W;gx+=44){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}ctx.globalAlpha=1;for(let b of blocks){ctx.save();ctx.shadowColor='#ff4fa5';ctx.shadowBlur=18;ctx.fillStyle='#ff4fa5';rr(b.x,b.y,b.w,b.h,8);ctx.fill();ctx.restore()}for(let q of particles){ctx.save();ctx.globalAlpha=Math.max(0,q.life/q.maxLife);ctx.fillStyle='#b5fbff';ctx.shadowColor='#8ffcff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.save();ctx.shadowColor=flash>0?'#fff':'#6ff8ff';ctx.shadowBlur=flash>0?40:24;let g=ctx.createRadialGradient(p.x-4,p.y-5,2,p.x,p.y,p.r+5);g.addColorStop(0,'#fff');g.addColorStop(.35,'#7cf8ff');g.addColorStop(1,'#397dff');ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();for(let q of texts){let prog=1-q.life/q.maxLife,alpha=prog<.22?prog/.22:1-Math.max(0,(prog-.35)/.65),scale=prog<.35?.72+prog/.35*.55:1.27-(prog-.35)*.42;ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.translate(q.x,q.y);ctx.scale(scale,scale);ctx.fillStyle='#9ffcff';ctx.shadowColor='#9ffcff';ctx.shadowBlur=18;ctx.font='900 16px sans-serif';ctx.textAlign='center';ctx.fillText(q.text,0,0);ctx.restore()}}
function frame(now){let dt=last?Math.min((now-last)/1000,.033):0;last=now;if(started&&!dead&&!paused)update(dt);draw();requestAnimationFrame(frame)}
function getX(e){if(e.touches&&e.touches.length)return e.touches[0].clientX;if(e.changedTouches&&e.changedTouches.length)return e.changedTouches[0].clientX;return e.clientX}
function begin(e){if(e.target===pauseBtn)return;if(e.cancelable)e.preventDefault();if(paused){setPaused(false);return}if(!started||dead)reset();dragging=true;lastTouchX=getX(e)}
function move(e){if(e.cancelable)e.preventDefault();if(!dragging||!started||dead||paused)return;let X=getX(e),dx=(X-lastTouchX)*controlGain;lastTouchX=X;p.targetX=Math.max(p.r+2,Math.min(W-p.r-2,p.targetX+dx))}
function stop(){dragging=false;p.targetX=p.x}
function pp(e){if(e.cancelable)e.preventDefault();e.stopPropagation();setPaused(!paused)}
pauseBtn.addEventListener('touchstart',pp,{passive:false});pauseBtn.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')pp(e)});document.addEventListener('touchstart',begin,{passive:false});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',stop,{passive:false});document.addEventListener('touchcancel',stop,{passive:false});document.addEventListener('mousedown',begin);document.addEventListener('mousemove',e=>{if(e.buttons)move(e)});document.addEventListener('mouseup',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!dead&&!paused)setPaused(true)});resize();requestAnimationFrame(frame)})();
</script>
</body>
</html>
