<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#07101d">
<title>霓虹闪避</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07101d;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
body{position:fixed;inset:0}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;color:#fff}
#top{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}
.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.15);font-weight:700;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:86%;max-width:380px;padding:26px 20px;border-radius:28px;background:rgba(8,16,31,.58);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
#title{font-size:34px;font-weight:900;letter-spacing:2px}
#text{margin-top:12px;opacity:.8;line-height:1.65;font-size:15px}
#hint{margin-top:18px;font-size:18px;font-weight:800;animation:pulse 1.15s infinite}
#tip{margin-top:10px;font-size:12px;opacity:.5}
@keyframes pulse{50%{opacity:.32;transform:scale(.98)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <div class="pill">分数 <span id="score">0</span></div>
    <div class="pill">最高 <span id="best">0</span></div>
  </div>
  <div id="center">
    <div id="title">霓虹闪避</div>
    <div id="text">左右拖动蓝色小球，躲避粉色障碍。<br>坚持越久，速度越快。</div>
    <div id="hint">触摸屏幕开始</div>
    <div id="tip">竖屏 · 单手操作</div>
  </div>
</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
var scoreEl=document.getElementById('score');
var bestEl=document.getElementById('best');
var center=document.getElementById('center');
var W=0,H=0,DPR=1;
var started=false,dead=false,last=0,time=0,spawn=0,score=0;
var best=0;
try{best=parseInt(localStorage.getItem('neonBest')||'0',10)||0;}catch(e){}
bestEl.textContent=best;
var player={x:0,y:0,r:14,targetX:0};
var blocks=[];
var stars=[];

function resize(){
  W=window.innerWidth; H=window.innerHeight;
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.floor(W*DPR);
  canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  player.y=H*0.82;
  if(!player.x){player.x=W/2;player.targetX=W/2;}
  makeStars();
}
window.addEventListener('resize',resize);

function makeStars(){
  stars=[];
  var count=Math.max(35,Math.floor(W*H/12000));
  for(var i=0;i<count;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.3,a:Math.random()*.55+.15});
}

function reset(){
  started=true;dead=false;last=performance.now();time=0;spawn=0;score=0;
  blocks.length=0;player.x=W/2;player.targetX=W/2;player.y=H*0.82;
  scoreEl.textContent='0';center.style.display='none';
}

function endGame(){
  if(dead)return;
  dead=true;started=false;
  if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neonBest',String(best));}catch(e){}}
  center.style.display='block';
  center.innerHTML='<div id="title">撞到了</div><div id="text">本局 <b>'+score+'</b> 分<br>最高 <b>'+best+'</b> 分</div><div id="hint">点一下重新开始</div><div id="tip">越往后障碍越快</div>';
  if(navigator.vibrate)try{navigator.vibrate(70);}catch(e){}
}

function addBlock(){
  var d=Math.min(time/45000,1);
  var w=38+Math.random()*(62+d*25);
  var h=18+Math.random()*28;
  blocks.push({x:10+Math.random()*Math.max(1,W-w-20),y:-h-10,w:w,h:h,v:220+d*250+Math.random()*90});
}

function collide(b){
  var nx=Math.max(b.x,Math.min(player.x,b.x+b.w));
  var ny=Math.max(b.y,Math.min(player.y,b.y+b.h));
  var dx=player.x-nx,dy=player.y-ny;
  return dx*dx+dy*dy<player.r*player.r;
}

function update(dt){
  time+=dt*1000;
  var d=Math.min(time/45000,1);
  spawn-=dt;
  if(spawn<=0){spawn=.62-d*.31;addBlock();if(d>.62&&Math.random()<.18)addBlock();}
  player.x+=(player.targetX-player.x)*Math.min(1,dt*16);
  player.x=Math.max(player.r+4,Math.min(W-player.r-4,player.x));
  for(var i=blocks.length-1;i>=0;i--){
    var b=blocks[i];b.y+=b.v*dt;
    if(collide(b)){endGame();return;}
    if(b.y>H+60)blocks.splice(i,1);
  }
  score=Math.floor(time/100);scoreEl.textContent=score;
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
  ctx.clearRect(0,0,W,H);
  var bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#0d1832');bg.addColorStop(1,'#05080f');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(var s=0;s<stars.length;s++){var st=stars[s];ctx.globalAlpha=st.a;ctx.fillStyle='#dce9ff';ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=.08;ctx.strokeStyle='#7ea8ff';ctx.lineWidth=1;var gap=44,off=(time*.035)%gap;
  for(var y=-gap+off;y<H;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(var x=0;x<W;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  ctx.globalAlpha=1;
  for(var i=0;i<blocks.length;i++){var b=blocks[i];ctx.save();ctx.shadowColor='#ff4fa5';ctx.shadowBlur=18;ctx.fillStyle='#ff4fa5';rr(b.x,b.y,b.w,b.h,8);ctx.fill();ctx.restore();}
  ctx.save();ctx.shadowColor='#6ff8ff';ctx.shadowBlur=24;var g=ctx.createRadialGradient(player.x-4,player.y-5,2,player.x,player.y,player.r+5);g.addColorStop(0,'#fff');g.addColorStop(.35,'#7cf8ff');g.addColorStop(1,'#397dff');ctx.fillStyle=g;ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.restore();
}

function frame(now){var dt=last?Math.min((now-last)/1000,.033):0;last=now;if(started&&!dead)update(dt);draw();requestAnimationFrame(frame);}

function getX(e){if(e.touches&&e.touches.length)return e.touches[0].clientX;if(e.changedTouches&&e.changedTouches.length)return e.changedTouches[0].clientX;return e.clientX;}
function press(e){if(e.cancelable)e.preventDefault();var x=getX(e);if(!started||dead)reset();player.targetX=x;}
function move(e){if(e.cancelable)e.preventDefault();if(started&&!dead)player.targetX=getX(e);}

document.addEventListener('touchstart',press,{passive:false});
document.addEventListener('touchmove',move,{passive:false});
document.addEventListener('mousedown',press);
document.addEventListener('mousemove',function(e){if(e.buttons)move(e);});
resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
