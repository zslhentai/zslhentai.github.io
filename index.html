<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>霓虹闪避 V1.1</title><body style="margin:0;background:#07101d"><script>(async()=>{const ps=['v11/p1.txt','v11/p2.txt','v11/p3.txt','v11/p4.txt','v11/p5.txt','v11/p6.txt','v11/p7.txt','v11/p8.txt'],lens=[4500,4500,4500,4500,4500,4500,4500,2117],rs=await Promise.all(ps.map((p,i)=>fetch(p+'?v=110').then(async r=>{if(!r.ok)throw Error('HTTP '+r.status+' '+p);let t=await r.text();if(t.length!==lens[i])throw Error('PART '+(i+1)+' LENGTH '+t.length+' / '+lens[i]);return t})));let h=rs.join('');if(h.length!==33617)throw Error('TOTAL LENGTH '+h.length+' / 33617);document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML='<pre style="color:white;padding:20px;font:16px monospace">LOAD ERROR '+e.message+'</pre>'})</script>
