<script>
(()=>{'use strict';
const wrap=document.getElementById('gameWrap'),c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),center=document.getElementById('center'),pauseBtn=document.getElementById('pauseBtn'),comboHud=document.getElementById('comboHud'),eventHud=document.getElementById('eventHud'),eventTitle=document.getElementById('eventTitle'),eventSub=document.getElementById('eventSub'),debugEl=document.getElementById('debug');
const DEBUG=new URLSearchParams(location.search).get('debug')==='1';
const STATE={NORMAL:'NORMAL',WARNING:'WARNING',ACTIVE:'ACTIVE',RECOVERY:'RECOVERY'};
const EVENT={NONE:null,METEOR:'METEOR',SIDE:'SIDE'};
let W=0,H=0,DPR=1,started=false,dead=false,paused=false,last=0,time=0,score=0,best=0,bonus=0,combo=0,comboTimer=0,grazeCount=0,maxCombo=0,flash=0,shakeT=0,shakeP=0,dragging=false,lastTouchX=0,lastTouchY=0,spawnT=.2,eventCooldown=9,eventMood=0,recoverT=0,nearDanger=0,quality=1,lowFpsT=0,fps=60,fpsAcc=0,fpsN=0,fpsWindow=0,blocks=[],particles=[],texts=[],stars=[],warnings=[];
const pools={block:[],particle:[]};
const machine={state:STATE.NORMAL,type:EVENT.NONE,phase:0,t:0,total:0,max:0,data:null,rewarded:false};
const p={x:0,y:0,r:14,targetX:0,targetY:0,maxSpeed:930,minY:90};
try{best=+localStorage.getItem('neonBest')||0}catch(e){}bestEl.textContent=best;debugEl.style.display=DEBUG?'block':'none';
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);c.width=W*DPR;c.height=H*DPR;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);p.minY=Math.max(82,70+(parseFloat(getComputedStyle(document.documentElement).fontSize)||16));if(!p.x){p.x=p.targetX=W/2;p.y=p.targetY=H*.78}stars=[];for(let i=0,n=Math.max(44,Math.floor(W*H/10000));i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.3+Math.random()*1.5,a:.1+Math.random()*.55})}addEventListener('resize',resize);
function clampPlayer(){p.targetX=Math.max(p.r+4,Math.min(W-p.r-4,p.targetX));p.targetY=Math.max(p.minY+p.r,Math.min(H-p.r-8,p.targetY))}
function acquire(pool,obj){let o=pools[pool].pop()||{};for(const k in o)delete o[k];return Object.assign(o,obj)}
function release(pool,o){if(pools[pool].length<220)pools[pool].push(o)}
function clearObjects(){for(const b of blocks)release('block',b);blocks.length=0;for(const q of particles)release('particle',q);particles.length=0;texts.length=0;warnings.length=0}
function makeBlock(o){return acquire('block',Object.assign({type:'rect',x:0,y:-60,w:60,h:28,vx:0,vy:0,radius:0,angle:0,spin:0,grazed:false,entered:false,passed:false,minGap:9999,event:false,trail:false,hitScale:1},o))}
function resetMachine(){machine.state=STATE.NORMAL;machine.type=EVENT.NONE;machine.phase=0;machine.t=machine.total=machine.max=0;machine.data=null;machine.rewarded=false}
function reset(){started=true;dead=false;paused=false;last=performance.now();time=score=bonus=combo=comboTimer=grazeCount=maxCombo=flash=shakeT=shakeP=0;spawnT=.18;eventCooldown=8.5;eventMood=0;recoverT=0;nearDanger=0;quality=1;lowFpsT=0;clearObjects();resetMachine();p.x=p.targetX=W/2;p.y=p.targetY=H*.78;scoreEl.textContent='0';comboHud.style.opacity='0';center.style.display='none';pauseBtn.style.display='flex';pauseBtn.textContent='Ⅱ';wrap.style.transform='translate3d(0,0,0)';announce('RUSH START','自由移动 · CORE SYSTEM')}
function setPaused(v){if(!started||dead)return;paused=v;dragging=false;pauseBtn.textContent=v?'▶':'Ⅱ';if(v){center.style.display='block';center.innerHTML='<div id="title">已暂停</div><div id="text">分数 '+score+'<br>'+machine.state+(machine.type?' · '+machine.type:'')+'</div><div id="hint">点屏幕继续</div>'}else{center.style.display='none';last=performance.now()}}
function announce(a,b){eventTitle.textContent=a;eventSub.textContent=b||'';eventHud.classList.remove('show');void eventHud.offsetWidth;eventHud.classList.add('show')}
function shake(t,pow){shakeT=Math.max(shakeT,t);shakeP=Math.max(shakeP,pow)}
function endGame(){if(dead)return;dead=true;started=false;pauseBtn.style.display='none';comboHud.style.opacity='0';shake(.22,12);if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('neonBest',best)}catch(e){}}center.style.display='block';center.innerHTML='<div id="title">撞到了</div><div id="text">本局 <b>'+score+'</b> 分<br>生存 '+(time/1000).toFixed(1)+' 秒<br>擦边 '+grazeCount+' 次 · 最高 COMBO ×'+maxCombo+'<br>事件奖励 +'+bonus+'</div><div id="hint">点一下重新开始</div><div id="tip">V0.8 · 稳定性与性能底座</div>';if(navigator.vibrate)try{navigator.vibrate([28,28,72])}catch(e){}}
function spawnRect(){let w=40+Math.random()*66,h=18+Math.random()*24,x=Math.random()*(W-w);blocks.push(makeBlock({type:'rect',x,y:-h-12,w,h,vy:355+Math.random()*105,hitScale:.96}))}
function spawnCircle(){let r=18+Math.random()*14,x=r+Math.random()*(W-2*r),dir=Math.random()<.5?-1:1;blocks.push(makeBlock({type:'circle',x,y:-r-15,radius:r,w:r*2,h:r*2,vy:350+Math.random()*100,vx:dir*(52+Math.random()*62),hitScale:.94}))}
function spawnHex(){let r=20+Math.random()*15,x=r+Math.random()*(W-2*r);blocks.push(makeBlock({type:'hex',x,y:-r-18,radius:r,w:r*2,h:r*2,vy:370+Math.random()*110,spin:(Math.random()<.5?-1:1)*(1.5+Math.random()*2.3),hitScale:.84}))}
function spawnBar(){let gap=Math.max(110,Math.min(150,W*.34)),gx=18+Math.random()*Math.max(1,W-gap-36),h=24+Math.random()*14,v=365+Math.random()*65;if(gx>28)blocks.push(makeBlock({type:'bar',x:0,y:-h,w:gx,h,vy:v,hitScale:.94}));let rx=gx+gap;if(W-rx>28)blocks.push(makeBlock({type:'bar',x:rx,y:-h,w:W-rx,h,vy:v,hitScale:.94}))}
function spawnNormal(){let r=Math.random();if(r<.25)spawnCircle();else if(r<.47)spawnHex();else if(r<.82)spawnRect();else spawnBar()}
function transition(state){machine.state=state;machine.t=0;machine.phase=0}
function startEvent(kind){for(const b of blocks)release('block',b);blocks.length=0;warnings.length=0;machine.type=kind;machine.total=0;machine.rewarded=false;machine.data={};eventMood=0;recoverT=0;spawnT=999;if(kind===EVENT.METEOR){machine.max=6.2;machine.data.dir=Math.random()<.5?1:-1;machine.data.seed=Math.random()*Math.PI*2;warnings.push({type:'diag',life:1.12,max:1.12,dir:machine.data.dir,curveSeed:machine.data.seed});announce('WARNING','POLYGON STORM · 跟住安全通道')}else{machine.max=5.8;machine.data.firstSide=Math.random()<.5?'left':'right';warnings.push({type:'side',side:machine.data.firstSide,band:'low',life:1.0,max:1.0});announce('WARNING','SIDE BARRAGE · 看左右充能')}transition(STATE.WARNING);if(navigator.vibrate)try{navigator.vibrate(24)}catch(e){}}
function rewardEvent(label){if(machine.rewarded)return;machine.rewarded=true;let add=45;bonus+=add;texts.push({x:p.x,y:p.y-30,t:label+' +'+add,life:1.05,max:1.05,big:true});burst(p.x,p.y,18);shake(.14,5);announce(label,'事件通过 +'+add);transition(STATE.RECOVERY);recoverT=.85;eventCooldown=9+Math.random()*5;spawnT=.95;warnings.length=0}
function abortEvent(reason){warnings.length=0;for(let i=blocks.length-1;i>=0;i--){if(blocks[i].event){release('block',blocks[i]);blocks.splice(i,1)}}announce('SYSTEM RECOVERY',reason||'事件异常 · 已安全退出');machine.type=EVENT.NONE;machine.data=null;machine.rewarded=true;transition(STATE.RECOVERY);recoverT=.9;eventCooldown=8;spawnT=1.0}
function spawnMeteorWave(){let dir=machine.data.dir,seed=machine.data.seed,cols=Math.ceil(W/42)+6,rows=9,gapCol=Math.floor(3+Math.random()*Math.max(2,cols-7)),gapHalf=Math.max(2.35,Math.min(2.85,W/158));for(let r=0;r<rows;r++){let bend=Math.sin(seed+r*.82)*.55;for(let col=-3;col<cols;col++){let shifted=col+r*dir*.52+bend;if(Math.abs(shifted-gapCol)<gapHalf)continue;let rad=13+Math.random()*7,x=shifted*42+20,y=-80-r*47-Math.random()*10;blocks.push(makeBlock({type:'meteor',x,y,radius:rad,w:rad*2,h:rad*2,vx:dir*(96+Math.random()*26),vy:322+Math.random()*48,spin:(Math.random()<.5?-1:1)*(1.8+Math.random()*2),event:true,trail:true,hitScale:.78}))}}}
function spawnSideShot(side,band){let y=band==='low'?H*.72:band==='high'?H*.26:H*.5,h=30+Math.random()*12,w=Math.min(170,W*.38),fromLeft=side==='left',x=fromLeft?-w-10:W+10,vx=(fromLeft?1:-1)*(610+Math.random()*90);blocks.push(makeBlock({type:'shot',x,y:y-h/2,w,h,vx,vy:0,event:true,trail:true,hitScale:.9}))}
function updateMachine(dt){machine.t+=dt;machine.total+=dt;if(machine.type&&machine.total>machine.max){abortEvent('超时保险触发');return}let targetMood=machine.type?1:0;eventMood+=(targetMood-eventMood)*Math.min(1,dt*4);if(machine.state===STATE.NORMAL){eventCooldown-=dt;if(eventCooldown<=0&&time>7000)startEvent(Math.random()<.52?EVENT.METEOR:EVENT.SIDE);return}if(machine.state===STATE.RECOVERY){recoverT-=dt;if(recoverT<=0){machine.type=EVENT.NONE;machine.data=null;transition(STATE.NORMAL)}return}if(machine.type===EVENT.METEOR){if(machine.state===STATE.WARNING&&machine.t>=1.02){warnings.length=0;spawnMeteorWave();transition(STATE.ACTIVE);shake(.1,3.5)}else if(machine.state===STATE.ACTIVE&&machine.t>=4.0)rewardEvent('RAIN CLEAR');return}if(machine.type===EVENT.SIDE){if(machine.state===STATE.WARNING&&machine.phase===0&&machine.t>=.98){let w=warnings[0]||{side:'left',band:'low'};spawnSideShot(w.side||'left','low');warnings.length=0;transition(STATE.ACTIVE);machine.phase=1;shake(.08,3);return}if(machine.state===STATE.ACTIVE&&machine.phase===1&&machine.t>=.62){let side=Math.random()<.5?'left':'right';warnings=[{type:'side',side,band:'high',life:1.02,max:1.02}];machine.phase=2;machine.t=0;return}if(machine.state===STATE.ACTIVE&&machine.phase===2&&machine.t>=.96){let w=warnings[0]||{side:'right',band:'high'};spawnSideShot(w.side||'right','high');warnings.length=0;machine.phase=3;machine.t=0;shake(.08,3);return}if(machine.state===STATE.ACTIVE&&machine.phase===3&&machine.t>=1.2)rewardEvent('BARRAGE CLEAR')}}
function rectDist(b){let inset=(1-b.hitScale)*Math.min(b.w,b.h)*.5,x=b.x+inset,y=b.y+inset,w=Math.max(2,b.w-inset*2),h=Math.max(2,b.h-inset*2),nx=Math.max(x,Math.min(p.x,x+w)),ny=Math.max(y,Math.min(p.y,y+h));return Math.hypot(p.x-nx,p.y-ny)}
function circleDist(b){return Math.hypot(p.x-b.x,p.y-b.y)-b.radius*b.hitScale}
function hitDist(b){return ['circle','hex','meteor'].includes(b.type)?circleDist(b):rectDist(b)}
function hGap(b){if(['circle','hex','meteor'].includes(b.type))return Math.abs(p.x-b.x)-b.radius*b.hitScale;if(p.x<b.x)return b.x-p.x;if(p.x>b.x+b.w)return p.x-(b.x+b.w);return 0}
function burst(x,y,n=12){n=Math.max(4,Math.round(n*quality));for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=60+Math.random()*140;particles.push(acquire('particle',{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-25,life:.58,max:.58,size:2+Math.random()*3}))}}
function popCombo(){comboHud.classList.remove('pop');void comboHud.offsetWidth;comboHud.classList.add('pop')}
function graze(b){if(b.grazed)return;b.grazed=true;grazeCount++;combo++;maxCombo=Math.max(maxCombo,combo);comboTimer=2.15;let add=(b.event?15:10)+Math.min(combo-1,10)*3;bonus+=add;flash=.18;shake(.1,combo>=5?5:3.2);burst(p.x,p.y);texts.push({x:p.x,y:p.y-28,t:'擦边 +'+add,life:.82,max:.82});comboHud.textContent=combo>1?'COMBO ×'+combo:'擦边';comboHud.style.opacity='1';popCombo();if(navigator.vibrate)try{navigator.vibrate(16)}catch(e){}}
function updateQuality(dt){if(dt<=0)return;fpsAcc+=1/dt;fpsN++;fpsWindow+=dt;if(fpsWindow>=1){fps=fpsAcc/fpsN;fpsAcc=fpsN=fpsWindow=0;if(fps<47)lowFpsT+=1;else lowFpsT=Math.max(0,lowFpsT-1);quality=lowFpsT>=3?.58:lowFpsT>=1?.78:1}}
function update(dt){time+=dt*1000;updateQuality(dt);if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=0;comboHud.style.opacity='0'}}if(flash>0)flash-=dt;if(shakeT>0){shakeT-=dt;let k=Math.min(1,shakeT/.11),dx=(Math.random()*2-1)*shakeP*k,dy=(Math.random()*2-1)*shakeP*.7*k;wrap.style.transform='translate3d('+dx+'px,'+dy+'px,0)';shakeP*=.92}else wrap.style.transform='translate3d(0,0,0)';let dx=p.targetX-p.x,dy=p.targetY-p.y,dist=Math.hypot(dx,dy),ms=p.maxSpeed*dt;if(dist>ms){dx=dx/dist*ms;dy=dy/dist*ms}p.x+=dx;p.y+=dy;p.x=Math.max(p.r+4,Math.min(W-p.r-4,p.x));p.y=Math.max(p.minY+p.r,Math.min(H-p.r-8,p.y));updateMachine(dt);if(machine.state===STATE.NORMAL){spawnT-=dt;if(spawnT<=0){spawnT=.38*(.82+Math.random()*.34);spawnNormal()}}for(let i=warnings.length-1;i>=0;i--)warnings[i].life=Math.max(0,warnings[i].life-dt);nearDanger=0;for(let i=blocks.length-1;i>=0;i--){let b=blocks[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.angle+=b.spin*dt;if((b.type==='circle'||b.type==='hex')&&(b.x<b.radius||b.x>W-b.radius)){b.vx*=-1;b.x=Math.max(b.radius,Math.min(W-b.radius,b.x))}let hd=hitDist(b);if(hd<p.r){endGame();return}if(hd<p.r+34)nearDanger=Math.max(nearDanger,1-(hd-p.r)/34);if(!b.grazed){let rr=['circle','hex','meteor'].includes(b.type)?b.radius*b.hitScale:0,top=rr?b.y-rr:b.y,bottom=rr?b.y+rr:b.y+b.h;if(top<=p.y+p.r&&bottom>=p.y-p.r){b.entered=true;let g=hGap(b);if(g>0)b.minGap=Math.min(b.minGap,g)}if(b.entered&&!b.passed&&top>p.y+p.r){b.passed=true;if(b.minGap>p.r&&b.minGap<=p.r+(b.event?40:34))graze(b);else b.grazed=true}}let off=b.y>H+140||b.x>W+280||b.x+b.w<-280;if(off){release('block',b);blocks.splice(i,1)}}for(let i=texts.length-1;i>=0;i--){texts[i].life-=dt;texts[i].y-=48*dt;if(texts[i].life<=0)texts.splice(i,1)}for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=180*dt;q.life-=dt;if(q.life<=0){release('particle',q);particles.splice(i,1)}}score=Math.floor(time/90)+bonus;scoreEl.textContent=score;if(DEBUG)debugEl.textContent='FPS '+fps.toFixed(0)+'  Q '+quality.toFixed(2)+'\nSTATE '+machine.state+(machine.type?' / '+machine.type:'')+'\nPHASE '+machine.phase+'  T '+machine.t.toFixed(2)+' / '+machine.total.toFixed(2)+'\nBLOCKS '+blocks.length+'  PARTICLES '+particles.length+'\nPOOL B '+pools.block.length+'  P '+pools.particle.length}
function rr(X,Y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(X+r,Y);ctx.arcTo(X+w,Y,X+w,Y+h,r);ctx.arcTo(X+w,Y+h,X,Y+h,r);ctx.arcTo(X,Y+h,X,Y,r);ctx.arcTo(X,Y,X+w,Y,r);ctx.closePath()}
function poly(cx,cy,r,n,ang){ctx.beginPath();for(let i=0;i<n;i++){let a=ang+i*Math.PI*2/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function drawWarning(){for(const w of warnings){let life=w.max?Math.max(0,w.life/w.max):1,pulse=.55+.45*Math.sin((1-life)*Math.PI*10),a=Math.max(.15,life)*pulse;ctx.save();if(w.type==='side'){let left=w.side==='left',y=w.band==='low'?H*.72:w.band==='high'?H*.26:H*.5,charge=1-life,edge=80+charge*70;let grd=ctx.createLinearGradient(left?0:W,left?0:W,left?edge:W-edge,0);grd.addColorStop(0,'rgba(255,70,140,'+Math.min(1,a+.25)+')');grd.addColorStop(1,'rgba(255,70,140,0)');ctx.fillStyle=grd;ctx.fillRect(left?0:W-edge,y-58,edge,116);ctx.strokeStyle='rgba(255,190,225,'+Math.min(1,a+.2)+')';ctx.lineWidth=3+charge*2;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(left?0:W,y);ctx.lineTo(W*.5,y);ctx.stroke();if(life<.18){ctx.globalAlpha=(.18-life)/.18*.8;ctx.fillStyle='#fff';ctx.fillRect(left?0:W-18,y-64,18,128)}}else{ctx.strokeStyle='rgba(220,120,255,'+Math.min(1,a+.15)+')';ctx.lineWidth=4;ctx.setLineDash([14,10]);let dir=w.dir||1;for(let k=-2;k<5;k++){ctx.beginPath();if(dir>0){ctx.moveTo(k*90,-20);ctx.lineTo(k*90+W*.75,H*.58)}else{ctx.moveTo(W-k*90,-20);ctx.lineTo(W-k*90-W*.75,H*.58)}ctx.stroke()}}ctx.restore()}}
function drawDebugHitboxes(){if(!DEBUG)return;ctx.save();ctx.strokeStyle='rgba(90,255,150,.8)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='rgba(255,240,90,.8)';for(const b of blocks){if(['circle','hex','meteor'].includes(b.type)){ctx.beginPath();ctx.arc(b.x,b.y,b.radius*b.hitScale,0,Math.PI*2);ctx.stroke()}else{let inset=(1-b.hitScale)*Math.min(b.w,b.h)*.5;ctx.strokeRect(b.x+inset,b.y+inset,b.w-inset*2,b.h-inset*2)}}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let mood=machine.type?Math.min(1,eventMood):0,bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,mood?'#21133a':'#0d1832');bg.addColorStop(1,mood?'#080814':'#05080f');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);for(let s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#dce9ff';ctx.beginPath();ctx.arc(s.x,(s.y+time*.02*(machine.type?1.8:1))%H,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=.07;ctx.strokeStyle=machine.type?'#c484ff':'#7ea8ff';for(let gy=(time*.045)%44-44;gy<H;gy+=44){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}for(let gx=0;gx<W;gx+=44){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,H);ctx.stroke()}ctx.globalAlpha=1;drawWarning();for(let b of blocks){ctx.save();let col=b.event?'#ff62c6':'#ff4fa5';if(b.trail&&quality>.65){ctx.globalAlpha=.18+.08*quality;ctx.strokeStyle=col;ctx.lineWidth=Math.max(8,b.h||b.radius);ctx.beginPath();ctx.moveTo(b.x-(b.vx>0?80:-80),b.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1}ctx.shadowColor=col;ctx.shadowBlur=(b.event?24:18)*quality;ctx.fillStyle=col;if(b.type==='circle'){ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill()}else if(b.type==='hex'||b.type==='meteor'){poly(b.x,b.y,b.radius,6,b.angle);ctx.fill()}else{rr(b.x,b.y,b.w,b.h,8);ctx.fill()}ctx.restore()}for(let q of particles){ctx.save();ctx.globalAlpha=Math.max(0,q.life/q.max);ctx.fillStyle='#b5fbff';ctx.shadowColor='#8ffcff';ctx.shadowBlur=12*quality;ctx.beginPath();ctx.arc(q.x,q.y,q.size,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.save();let pulse=1+nearDanger*.12*Math.sin(time*.035);ctx.translate(p.x,p.y);ctx.scale(pulse,pulse);if(nearDanger>.02){ctx.strokeStyle='rgba(160,255,255,'+(nearDanger*.55)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,p.r+8+nearDanger*4,0,Math.PI*2);ctx.stroke()}ctx.shadowColor=flash>0?'#fff':'#6ff8ff';ctx.shadowBlur=(flash>0?42:26)*quality;let g=ctx.createRadialGradient(-4,-5,2,0,0,p.r+6);g.addColorStop(0,'#fff');g.addColorStop(.35,'#7cf8ff');g.addColorStop(1,'#397dff');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();ctx.restore();for(let q of texts){let prog=1-q.life/q.max,alpha=prog<.2?prog/.2:1-Math.max(0,(prog-.35)/.65),sc=q.big?1.15+Math.sin(Math.min(1,prog)*Math.PI)*.35:.75+Math.min(1,prog/.28)*.5;ctx.save();ctx.globalAlpha=Math.max(0,Math.min(1,alpha));ctx.translate(q.x,q.y);ctx.scale(sc,sc);ctx.fillStyle=q.big?'#fff2ff':'#9ffcff';ctx.shadowColor=q.big?'#ff8ee5':'#9ffcff';ctx.shadowBlur=(q.big?28:18)*quality;ctx.font=(q.big?'900 18px':'900 16px')+' sans-serif';ctx.textAlign='center';ctx.fillText(q.t,0,0);ctx.restore()}drawDebugHitboxes()}
function frame(now){let dt=last?Math.min((now-last)/1000,.033):0;last=now;if(started&&!dead&&!paused)update(dt);draw();requestAnimationFrame(frame)}
function getPos(e){let t=e.touches&&e.touches.length?e.touches[0]:e.changedTouches&&e.changedTouches.length?e.changedTouches[0]:e;return{x:t.clientX,y:t.clientY}}
function begin(e){if(e.target===pauseBtn)return;if(e.cancelable)e.preventDefault();if(paused){setPaused(false);return}if(!started||dead)reset();dragging=true;let q=getPos(e);lastTouchX=q.x;lastTouchY=q.y}
function move(e){if(e.cancelable)e.preventDefault();if(!dragging||!started||dead||paused)return;let q=getPos(e),rawDx=q.x-lastTouchX,rawDy=q.y-lastTouchY,mag=Math.hypot(rawDx,rawDy),dynamicGain=mag<5?.72:mag<15?.9:1.07,dx=rawDx*dynamicGain,dy=rawDy*dynamicGain;lastTouchX=q.x;lastTouchY=q.y;p.targetX+=dx;p.targetY+=dy;clampPlayer()}
function stop(){dragging=false;p.targetX=p.x;p.targetY=p.y}
function pp(e){if(e.cancelable)e.preventDefault();e.stopPropagation();setPaused(!paused)}
pauseBtn.addEventListener('touchstart',pp,{passive:false});pauseBtn.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')pp(e)});document.addEventListener('touchstart',begin,{passive:false});document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',stop,{passive:false});document.addEventListener('touchcancel',stop,{passive:false});document.addEventListener('mousedown',begin);document.addEventListener('mousemove',e=>{if(e.buttons)move(e)});document.addEventListener('mouseup',stop);document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!dead&&!paused)setPaused(true)});resize();requestAnimationFrame(frame)})();
</script>
