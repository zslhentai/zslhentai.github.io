<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>仫仫的小食堂 · 8图首页预览</title><link rel="stylesheet" href="style.css?v=202608230052"><style>#homePage{background:linear-gradient(180deg,#fff8dc,#fffdf5);padding:14px 14px 112px}.hero{margin-bottom:14px}.track{display:flex;overflow:hidden;border-radius:26px;box-shadow:0 10px 24px rgba(151,115,52,.12)}.slide{min-width:100%;height:258px;position:relative;overflow:hidden}.slide img{width:100%;height:100%;object-fit:cover}.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,249,232,.93) 0%,rgba(255,249,232,.68) 44%,rgba(255,249,232,.08) 76%,transparent 100%)}.copy{position:absolute;z-index:2;left:17px;top:17px;max-width:57%;color:#654a36}.tag{display:inline-flex;background:rgba(255,255,255,.84);border:1px solid rgba(112,79,52,.08);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.copy h2{font-size:23px;line-height:1.2;margin:14px 0 7px}.copy p{font-size:11px;line-height:1.55;margin:0;color:#8c735e}.dots{display:flex;gap:7px;justify-content:center;margin-top:9px}.dot{border:0;padding:0;width:8px;height:8px;border-radius:50%;background:#dec47f}.dot.on{width:21px;border-radius:999px;background:#876147}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.action{border:1px solid #eedca8;background:#fffdf8;border-radius:18px;overflow:hidden;padding:0 0 11px;color:#6b4e39;box-shadow:0 6px 14px rgba(151,115,52,.05)}.action img{width:100%;aspect-ratio:1.05/1;object-fit:cover;display:block}.action b{display:block;font-size:14px;line-height:1;margin-top:10px;white-space:nowrap}.action span{display:block;font-size:9px;color:#ae8d72;margin-top:5px;white-space:nowrap}.corner{background:#fffefa;border:1px solid #efdfb7;border-radius:21px;padding:14px;margin-bottom:14px;box-shadow:0 7px 17px rgba(131,96,53,.05)}.corner-head h3{margin:0;font-size:17px;color:#674b36}.corner-head p{margin:4px 0 12px;font-size:11px;color:#a28770}.corner-body{display:grid;grid-template-columns:104px 1fr;gap:11px;align-items:stretch}.corner-pic{width:104px;height:126px;object-fit:cover;border-radius:17px}.corner-links{display:grid;grid-template-rows:repeat(3,1fr);gap:7px}.corner-link{border:0;border-radius:14px;background:#fff5cf;color:#70513b;text-align:left;padding:0 13px;font-size:13px;font-weight:800}.corner-link small{display:block;font-size:9px;font-weight:500;color:#a88b74;margin-top:3px}.memory{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#f6d76f,#efbc59);border-radius:21px;padding:14px;color:#624631;box-shadow:0 9px 20px rgba(169,123,34,.12)}.memory strong{font-size:18px;line-height:1.35}.memory p{font-size:10px;margin:5px 0 0;color:#80624a}.memory img{width:94px;height:94px;object-fit:cover;border-radius:20px;border:4px solid rgba(255,255,255,.45);flex:0 0 auto}.go{margin-top:10px;border:0;border-radius:12px;padding:8px 11px;background:#fff9e7;color:#654a36;font-weight:800;font-size:11px}@media(max-width:420px){.copy h2{font-size:21px}.actions{gap:7px}.action b{font-size:13px}.corner-body{grid-template-columns:92px 1fr}.corner-pic{width:92px;height:121px}.memory img{width:84px;height:84px}}</style></head><body><div id="mount"></div><script>const A=['hero1','hero2','hero3','eat','take','random','feature','footer'];Promise.all(A.map(n=>fetch('preview-assets/'+n+'.b64?v=202608230147',{cache:'no-store'}).then(r=>r.text()))).then(B=>{const U=B.map(x=>'data:image/jpeg;base64,'+x.trim());return fetch('page.html?v=202608230052',{cache:'no-store'}).then(r=>r.text()).then(t=>({t,U}))}).then(({t,U})=>{document.getElementById('mount').innerHTML=t;const s=document.createElement('script');s.src='app.js?v=202608230052';s.onload=()=>{const home=document.getElementById('homePage');home.innerHTML=`<div class="hero"><div class="track" id="track"><article class="slide"><img src="${U[0]}"><div class="copy"><span class="tag">仫仫的小食堂 · 今日份</span><h2>今天也要<br>一起好好吃饭</h2><p>只放我们真正会看的东西。</p></div></article><article class="slide"><img src="${U[1]}"><div class="copy"><span class="tag">♡ 最近想吃</span><h2>今天想吃点<br>不一样的</h2><p>看看最近收藏了什么。</p></div></article><article class="slide"><img src="${U[2]}"><div class="copy"><span class="tag">不知道吃什么</span><h2>那就交给<br>小食堂决定吧</h2><p>随机选一组，不纠结。</p></div></article></div><div class="dots"><button class="dot on"></button><button class="dot"></button><button class="dot"></button></div></div><div class="actions"><button class="action" id="eatNow"><img src="${U[3]}"><b>现在吃</b><span>马上看看吃什么</span></button><button class="action" id="takeAway"><img src="${U[4]}"><b>带走吃</b><span>打包带走也美味</span></button><button class="action" id="randomEat"><img src="${U[5]}"><b>随机吃</b><span>交给小食堂决定</span></button></div><section class="corner"><div class="corner-head"><h3>我们最近在忙什么呀 ♡</h3><p>三个最常用的小入口。</p></div><div class="corner-body"><img class="corner-pic" src="${U[6]}"><div class="corner-links"><button class="corner-link" id="wantList">想吃清单<small>看看最近想吃啥</small></button><button class="corner-link" id="todayPick">今日推荐<small>今天吃什么呀</small></button><button class="corner-link" id="lastRecord">吃饭记录<small>翻翻我们吃过啥</small></button></div></div></section><section class="memory"><div><strong>今天也要一起<br>好好吃饭 ♡</strong><p>仫仫的小食堂今天也营业中。</p><button class="go" id="goMenuBtn">去看看今天吃什么</button></div><img src="${U[7]}"></section>`;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));home.classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));const hn=document.querySelector('.nav[data-page="homePage"]');if(hn)hn.classList.add('active');const cb=document.getElementById('cartbar');if(cb)cb.style.display='none';let idx=0;const track=document.getElementById('track'),dots=[...document.querySelectorAll('.dot')];function show(i){idx=i;track.style.transform='translateX(-'+i*100+'%)';track.style.transition='transform .35s ease';dots.forEach((d,j)=>d.classList.toggle('on',j===i))}dots.forEach((d,i)=>d.onclick=()=>show(i));setInterval(()=>show((idx+1)%3),3600);function go(page){const n=document.querySelector('.nav[data-page="'+page+'"]');if(n)switchPage(n)}document.getElementById('eatNow').onclick=()=>{go('menuPage');setMode('dine')};document.getElementById('takeAway').onclick=()=>{go('menuPage');setMode('pickup')};document.getElementById('randomEat').onclick=()=>toast('随机吃可以接回之前的随机推荐 ♡');document.getElementById('wantList').onclick=()=>toast('这里接想吃清单');document.getElementById('todayPick').onclick=()=>toast('这里接今日推荐');document.getElementById('lastRecord').onclick=()=>go('ordersPage');document.getElementById('goMenuBtn').onclick=()=>go('menuPage')};document.body.appendChild(s)}).catch(()=>{document.getElementById('mount').innerHTML='<div style="padding:30px">预览加载失败，请刷新重试。</div>'})</script></body></html>
