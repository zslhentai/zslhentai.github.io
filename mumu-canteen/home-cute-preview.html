()=>{const home=document.getElementById('homePage');home.innerHTML=`<div class="cute-hero"><div class="cute-track" id="cuteTrack"><article class="cute-slide s1"><span class="sticker">仫仫的小食堂 · 今日份</span><h2>今天也要<br>一起好好吃饭</h2><p>不做商业促销，只放我们真正会看的东西。</p><img class="purin-pic" src="assets/home.webp" alt="布丁狗"></article><article class="cute-slide s2"><span class="sticker">♡ 最近想吃</span><h2>仫仫说想吃<br>一点甜甜的</h2><div class="mini-list"><span class="mini-pill">小蛋糕</span><span class="mini-pill">焦糖布丁</span><span class="mini-pill">小松饼</span></div><img class="purin-pic" src="assets/avatar.webp" alt="布丁狗"></article><article class="cute-slide s3"><span class="sticker">今天不知道吃什么</span><h2>那就交给<br>小食堂决定吧</h2><p>随机选一组，不纠结，选中了就去点菜。</p><div class="heart-row"><span class="heart-chip">主食</span><span class="heart-chip">小吃</span><span class="heart-chip">甜的</span></div><img class="purin-pic" src="assets/menu.webp" alt="布丁狗"></article></div><div class="cute-dots"><button class="cute-dot active"></button><button class="cute-dot"></button><button class="cute-dot"></button></div></div><div class="home-actions"><button class="home-action" id="eatNow"><img class="action-pic" src="assets/home.webp"><strong>现在吃</strong><small>今天就吃它</small></button><button class="home-action" id="takeAway"><img class="action-pic" src="assets/avatar.webp"><strong>带走吃</strong><small>打包带走</small></button><button class="home-action" id="randomEat"><img class="action-pic" src="assets/menu.webp"><strong>随机吃</strong><small>帮我们选</small></button></div><section class="soft-card"><h3>我们的小入口 ♡</h3><p>只留真正会用到的三个功能。</p><div class="soft-grid"><button class="soft-item" id="wantList"><img class="soft-icon" src="assets/avatar.webp"><b>想吃清单</b></button><button class="soft-item" id="todayPick"><img class="soft-icon" src="assets/home.webp"><b>今日推荐</b></button><button class="soft-item" id="lastRecord"><img class="soft-icon" src="assets/record.webp"><b>吃饭记录</b></button></div></section><section class="memory-strip"><div><strong>今天也要一起好好吃饭</strong><p>这里以后可以放一句小公告、节日主题，或者你们自己的照片。</p><button class="cute-btn" id="goMenuBtn">去看看今天吃什么</button></div><img class="memory-pic" src="assets/avatar.webp" alt="布丁狗"></section>`;document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));home.classList.add('active');document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));const hn=document.querySelector('.nav[data-page="homePage"]');if(hn)hn.classList.add('active');const cb=document.getElementById('cartbar');if(cb)cb.style.display='none';let idx=0;const track=document.getElementById('cuteTrack');const dots=[...document.querySelectorAll('.cute-dot')];function set(i){idx=i;track.style.transform='translateX(-'+(i*100)+'%)';track.style.transition='transform .35s ease';dots.forEach((d,j)=>d.classList.toggle('active',j===i))}dots.forEach((d,i)=>d.onclick=()=>set(i));setInterval(()=>set((idx+1)%3),3600);function go(page){const n=document.querySelector('.nav[data-page="'+page+'"]');if(n)switchPage(n)}document.getElementById('eatNow').onclick=()=>{go('menuPage');setMode('dine')};document.getElementById('takeAway').onclick=()=>{go('menuPage');setMode('pickup')};document.getElementById('randomEat').onclick=()=>toast('随机吃可以接回我们之前的随机推荐 ♡');document.getElementById('wantList').onclick=()=>toast('这里接想吃清单');document.getElementById('todayPick').onclick=()=>toast('这里接今日推荐');document.getElementById('lastRecord').onclick=()=>go('ordersPage');document.getElementById('goMenuBtn').onclick=()=>go('menuPage')};document.body.appendChild(s)}).catch(()=>{document.getElementById('mount').innerHTML='<div style="padding:30px">预览加载失败，请刷新重试。</div>'})</script></body></html>
